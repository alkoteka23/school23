<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><!--
=====================================================================
 КАК УСТРОЕН ФАЙЛ (4 блока, сверху вниз)
 1) СТИЛИ (между тегами style)  — оформление. Цвета заданы переменными в начале (--ac = основной цвет).
 2) ЗАГОЛОВОК (тег header)      — название страницы. Кнопки модулей создаются автоматически.
 3) СКРИПТ, БЛОК «ДАННЫЕ»       — ВЕСЬ КОНТЕНТ: теория, тесты, кейсы.
    >>> Редактировать нужно ТОЛЬКО его. Инструкция — внутри блока. <<<
 4) СКРИПТ, БЛОК «ДВИЖОК»       — код, который рисует страницу и считает результат.
    Без необходимости не трогать.
=====================================================================
-->
<title>Школа руководителя: теория, тесты, кейсы</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=PT+Serif:wght@700&display=swap">
<style>
/* ===== 1. ОФОРМЛЕНИЕ =====
   Цвета:
 --bg фон страницы,
 --sf фон карточек,
 --tx текст,
 --mu серый текст,
 --ac основной цвет (кнопки, акценты), 
 --ok/--okb верный ответ, 
 --no/--nob неверный.
   Тёмная тема продублирована ниже (media и data-theme=dark): меняйте цвета в обоих местах. */
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--w:1100px; /* ширина содержимого страницы (меню, модули, вкладки, подвал); было 860px */
--bg:#FAF5EE;
--sf:#FFFFFF;
--tx:#4E0F1A;
--mu:#3B0A12;
--ac:#4E0F1A;
--ok:#cee1df;
--okb:#cee1df;
--no:#f4cccc;
--nob:#f4cccc;
--bd:#d5dedc}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#FAF5EE;--sf:#FFFFFF;--tx:#4E0F1A;--mu:#3B0A12;--ac:#4E0F1A;--ok:#cee1df;--okb:#cee1df;--no:#f4cccc;--nob:#f4cccc;--bd:#2c3a3d}}
:root[data-theme=dark]{--bg:#121a1c;--sf:#FFFFFF;--tx:#4E0F1A;--mu:#3B0A12;--ac:#4E0F1A;--ok:#cee1df;--okb:#cee1df;--no:#ff8a80;--nob:#3b1f1d;--bd:#2c3a3d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:#F6EBE3 linear-gradient(135deg,#F8EDE3 0%,#F2DFE0 48%,#D8E8E5 100%) no-repeat;min-height:100vh;color:var(--tx);font:16px/1.55 "PT Sans",system-ui,sans-serif}
/* верхнее меню: ОДНА строка — логотип | разделы | пользователь.
   Высота меню задаётся min-height и padding в .top-inner; ширина содержимого — max-width. */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;padding:14px 16px;background:transparent}
.top-inner{max-width:calc(var(--w,860px) - 32px);margin:auto;padding:6px 10px 6px 24px;min-height:56px;background:#4E0F1A;border-radius:999px;box-shadow:0 8px 24px rgba(78,15,26,.22);display:flex;flex-wrap:nowrap;align-items:center;gap:8px}
.top img{order:1;width:112px;height:auto;flex:none;object-fit:contain}
.brand{font:700 20px/1 "PT Serif",Georgia,serif;color:#FFFFFF;letter-spacing:.02em}
/* заглавный блок: крупный заголовок и картинка рядом */

h1{font:700 clamp(34px,7vw,60px)/1.1 "PT Serif",Georgia,serif;margin:0;color: #ffffff;}
nav{display:flex;gap:6px;overflow-x:auto;padding:12px 16px;max-width:var(--w,860px);margin:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}nav::-webkit-scrollbar{display:none}
main{max-width:var(--w,860px);margin:auto;padding:0 16px 40px}
h2{font:700 21px/1.25 "PT Serif",Georgia,serif;margin:8px 0 12px}
.tabs{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
details{background:var(--sf);border:1px solid var(--bd);border-radius:8px;margin-bottom:8px;padding:10px 14px}
summary{font-weight:700;cursor:pointer}details p{margin:8px 0 2px}
.q{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:14px;margin-bottom:12px}
.q b{display:block;margin-bottom:8px}
label{display:block;padding:7px 10px;border:1px solid var(--bd);border-radius:6px;margin-bottom:6px;cursor:pointer}
label.ok{background:var(--okb);border-color:var(--ok)}label.no{background:var(--nob);border-color:var(--no)}
.ex{font-size:14px;color:var(--mu);margin-top:6px}
.res{background:var(--sf);border:2px solid var(--ac);border-radius:10px;padding:16px;margin:14px 0;font-size:18px}
.res strong{font:700 30px "PT Serif",serif;color:var(--ac)}
.sit{background:var(--sf);border-left:4px solid var(--ac);padding:12px 14px;border-radius:0 8px 8px 0;margin-bottom:12px}
/* слайды: листаются свайпом, стрелками на экране или клавишами ← → */
.sl{position:relative;margin:10px 0 4px}
.st{display:flex;align-items:center;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;border:1px solid var(--bd);border-radius:8px;background:#fff}
.st::-webkit-scrollbar{display:none}
.st img{flex:none;width:100%;height:auto;display:block;scroll-snap-align:center;scroll-snap-stop:always}
.sl .pv,.sl .nx{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;border-radius:50%;background:var(--ac);color:var(--sf);font:700 24px/1 "PT Sans";cursor:pointer;opacity:.85;padding:0}
.sl .pv{left:8px}.sl .nx{right:8px}
.sl .pv:disabled,.sl .nx:disabled{opacity:.25;cursor:default}
.sl .cn{position:absolute;right:10px;bottom:10px;background:var(--ac);color:var(--sf);font-size:13px;padding:2px 10px;border-radius:12px}
.fm input{display:block;width:100%;padding:10px;margin:0 0 10px;border:1px solid var(--bd);border-radius:6px;font:inherit;color:var(--tx);background:var(--sf)}
/* ===== Блок пользователя в верхнем меню: аватар + имя + кнопка «Сменить» ===== */
.user{order:3;margin-left:auto;flex:none;display:flex;align-items:center;gap:8px;min-width:0;
  padding:3px 4px 3px 3px;border-radius:999px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22)}
.user[hidden]{display:none}
.ava{flex:none;width:32px;height:32px;border-radius:50%;background:#FAF5EE;color:#4E0F1A;
  display:grid;place-items:center;font:700 13px/1 "PT Sans",sans-serif;letter-spacing:.02em}
.uinfo{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.uname{color:#fff;font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:92px}
.ushop{color:rgba(255,255,255,.72);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:92px}
.swap svg{width:14px;height:14px;flex:none}

/* ===== Разделы верхнего меню: Продавцам / Администратору / Супервайзеру ===== */
.roles{order:2;flex:1 1 auto;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:0;padding:2px 0}
.roles::-webkit-scrollbar{display:none}
.roles[hidden]{display:none}

/* ===== ЕДИНЫЙ СТИЛЬ КНОПОК (как в верхнем меню) =====
   Все кнопки страницы: «таблетка», жирный шрифт, одинаковая высота.
   Обычная = контур, активная / главная = залитая.
   Размеры и цвета меняются только здесь. */
.btn,.fbtn,nav button,.tabs button,.chips button,.swap,.roles button{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:none;
  min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--ac);
  background:transparent;color:var(--ac);font:700 15px/1 "PT Sans",sans-serif;
  text-decoration:none;cursor:pointer;transition:background .15s,color .15s,transform .1s}
.btn:active,.fbtn:active,nav button:active,.tabs button:active,.chips button:active,.swap:active,.roles button:active{transform:scale(.97)}
.btn:disabled,.fbtn:disabled{opacity:.5;cursor:default}
/* контурные: подсветка при наведении */
nav button:hover,.tabs button:hover,.chips button:hover,.fbtn.alt:hover{background:rgba(78,15,26,.08)}
/* залитые: главная кнопка и выбранный пункт */
.btn,.fbtn,nav button[aria-current=true],.tabs button[aria-selected=true],.chips button[aria-pressed=true]{background:var(--ac);color:var(--sf)}
.btn:hover,.fbtn:hover,nav button[aria-current=true]:hover,.tabs button[aria-selected=true]:hover,.chips button[aria-pressed=true]:hover{background:#6a1a28}
.fbtn.alt{background:transparent;color:var(--ac)}
.fbtn.del{background:transparent;color:#B3261E;border-color:#B3261E}.fbtn.del:hover{background:rgba(179,38,30,.08)}
/* кнопки внутри верхнего меню (на тёмном фоне) */
.roles button{min-height:40px;padding:0 13px;font-size:14px;border-color:rgba(255,255,255,.28);color:#fff}
.roles button:hover{background:rgba(255,255,255,.14)}
.roles button[aria-current=true]{background:#FAF5EE;color:#4E0F1A;border-color:#FAF5EE}
.swap{min-height:32px;padding:0 12px;border:0;background:#FAF5EE;color:#4E0F1A;font-size:13px}
.swap:hover{background:#fff}
.swap:focus-visible,.roles button:focus-visible{outline:3px solid #fff;outline-offset:2px}
/* выбор теста (основной / загруженные) */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
/* кнопка «Выберите файл» в формах — в том же стиле */
input[type=file]::file-selector-button{margin-right:12px;padding:9px 16px;border:1px solid var(--ac);border-radius:999px;background:transparent;color:var(--ac);font:700 14px/1 "PT Sans",sans-serif;cursor:pointer}
input[type=file]::file-selector-button:hover{background:rgba(78,15,26,.08)}
/* ===== Вкладка «Материалы»: карточки файлов ===== */
.fc{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px}
.fi{flex:none;width:46px;height:52px;border-radius:8px;display:grid;place-items:center;color:#fff;font:700 12px/1 "PT Sans",sans-serif;letter-spacing:.03em}
.t-ppt{background:#C4492B}.t-pdf{background:#B3261E}.t-doc{background:#2B5CC4}.t-xls{background:#1E7A46}.t-img{background:#6B6B6B}
.fb{flex:1 1 180px;min-width:0}.fb b{display:block;overflow-wrap:anywhere}.fb .ex{margin:2px 0 0;overflow-wrap:anywhere}
.fa{display:flex;gap:8px;flex-wrap:wrap}
.edbar a,.ex a{color:var(--ac);font-weight:700}
.emb{position:relative;width:100%;border:1px solid var(--bd);border-radius:8px;overflow:hidden;background:#fff;margin-top:8px}
.emb.w{aspect-ratio:16/9;min-height:220px}.emb.t{height:min(75vh,640px)}
.emb iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.emb-img{display:block;width:100%;height:auto;border-radius:8px;margin-top:8px}
.fmsg{min-height:20px;font-size:14px;margin:0 0 8px;color:var(--mu)}
.edbar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
@media(max-width:760px){.fa{width:100%}.fa .fbtn{flex:1}}
.empty{background:var(--sf);border:1px dashed var(--bd);border-radius:10px;padding:22px 16px;text-align:center;color:var(--mu);margin-top:8px}

:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
header.hero {
  position: relative;
  isolation: isolate;
  width: 100%;
max-width: none;
box-sizing: border-box;
  height: 300px;
  margin: 0px auto;
  padding: 28px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  background: none;
}

header.hero::before {
  content: "";
  position: absolute;
  z-index: -1;
 inset: 0;
  background: url("images/fon.png") center / cover no-repeat;
  border-radius: 0px;
}

header.hero h1,
header.hero img {
  position: relative;
left: 200px; /* сдвинуть вправо */
}

header.hero img {
  display: block;
  width: 209px;
  height: auto;
  flex: none;
  border-radius: 12px;
  transform: translateX(-450px);
}

/* ===== ТЕЛЕФОН / ПЛАНШЕТ: на узких экранах сдвиги убираем, всё выстраивается в одну строку ===== */
@media (max-width: 760px) {
  header.hero {
    height: auto;
    min-height: 190px;
    padding: 22px 16px;
    gap: 12px;
    justify-content: space-between;
  }

  header.hero::before { inset: 0; }

  header.hero h1,
  header.hero img {
    left: 0;
    transform: none;
  }

  header.hero h1 {
    font-size: clamp(26px, 8vw, 40px);
    min-width: 0;
    overflow-wrap: anywhere;
  }

  header.hero img {
    width: 36%;
    max-width: 150px;
  }

  main { padding: 0 12px 32px; }
  nav { padding: 10px 12px; }
  .tabs button { white-space: nowrap; }
  label { padding: 11px 12px; }
  .btn { width: 100%; min-height: 46px; }
  .res strong { font-size: 26px; }
  .sl .pv, .sl .nx { width: 36px; height: 36px; }
}

/* ===== Режим редактора: неяркая кнопка в строке вкладок, всплывающие формы, отзыв ===== */
/* «Теория»: презентация слева (крупно), разделы справа; на узком экране — друг под другом.
   Соотношение колонок — первое число в grid-template-columns (1.6fr : 1fr). */
.th2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.thp{position:sticky;top:72px;max-height:calc(100vh - 90px);overflow:auto}
.thp .emb.w{min-height:300px}
.th2 details{margin-bottom:10px}
@media (max-width:860px){.th2{grid-template-columns:minmax(0,1fr)}.thp{position:static;max-height:none;overflow:visible}.thp .emb.w{min-height:220px}}
/* картинки в разделах теории: небольшие, не на всю ширину; по клику открываются крупно */
.timg{display:block;max-width:min(100%,520px);max-height:380px;width:auto;height:auto;object-fit:contain;margin:10px 0;
  border:1px solid var(--bd);border-radius:8px;background:#fff;cursor:zoom-in}
.ithumbs{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 8px}
.ith{position:relative}
.ith img{display:block;height:72px;width:auto;border:1px solid var(--bd);border-radius:6px;background:#fff}
.ith button{position:absolute;top:-7px;right:-7px;width:22px;height:22px;padding:0;border:0;border-radius:50%;background:var(--ac);color:var(--sf);font:700 14px/1 sans-serif;cursor:pointer}
dialog.dlg.zoom{width:auto;max-width:calc(100% - 24px)}
.zimg{display:block;max-width:100%;max-height:calc(100vh - 130px);margin:0 auto;border-radius:6px}
/* главная (приветственная) страница */
.hwel{margin:0 0 26px}
.hwel h2{margin:0 0 10px;font:700 28px/1.25 "PT Serif",Georgia,serif}
.hwel p{margin:0 0 8px;font-size:17px}
.hwel .btn{margin-top:10px}
.hcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-bottom:8px}
.hcard{display:flex;flex-direction:column;gap:8px;text-align:left;padding:18px 20px;border:1px solid #eadfd3;border-radius:14px;background:#FBF6F0;color:var(--tx);font:inherit;cursor:pointer;transition:box-shadow .15s,border-color .15s}
.hcard:hover:not(:disabled){border-color:var(--ac);box-shadow:0 4px 14px rgba(78,15,26,.12)}
.hcard b{font:700 20px/1.25 "PT Serif",Georgia,serif}
.hcard span{color:var(--mu);font-size:14px}
.hcard:disabled{opacity:.6;cursor:default}
.hbar{height:6px;border-radius:3px;background:#e6d8ca;overflow:hidden}.hbar i{display:block;height:100%;background:var(--ac)}
.hrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin:10px 0 8px;align-items:start}
.hrow.one{grid-template-columns:minmax(0,1fr)}
.hbox{background:#FBF6F0;border:1px solid #eadfd3;border-radius:14px;padding:18px 20px}
.hbox h3{margin:0 0 10px;font:700 20px/1.25 "PT Serif",Georgia,serif}
.hbox p{margin:0 0 8px;font-size:16px}
.hnews{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.hnews button{width:100%;display:flex;gap:12px;align-items:baseline;text-align:left;padding:8px 10px;border:0;border-radius:8px;background:transparent;color:var(--tx);font:inherit;font-size:15px;line-height:1.35;cursor:pointer}
.hnews button:hover{background:rgba(78,15,26,.07)}
.hnews time{flex:none;min-width:6.2em;color:var(--mu);font-size:13px}
.hnew{display:inline-block;margin-left:4px;padding:1px 8px;border-radius:999px;background:var(--ac);color:var(--sf);font-size:11px;font-weight:700;vertical-align:1px}
@media (max-width:860px){.hrow{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.hwel h2{font-size:23px}}

/* ===== ГЛАВНАЯ: градиентный фон, верхний блок с приветствием и фото, ниже белая панель =====
   Работает только на главной (у body класс «home»). Старая шапка и строка модулей на ней скрыты. */
body.home header.hero,body.home nav{display:none}
body.home main{padding-top:10px;padding-bottom:48px}
/* КАРТИНКА В ВЕРХНЕМ БЛОКЕ — меняйте три значения ниже:
   --img-w размер (ширина; высота подстроится сама), --img-x сдвиг вправо(+)/влево(−), --img-y сдвиг вниз(+)/вверх(−).
   Положение по вертикали: align-items в этом же правиле (flex-start — сверху, center — по центру, flex-end — снизу). */
.hhero{--img-w:clamp(120px,20vw,210px);--img-x:0px;--img-y:0px;display:flex;align-items:stretch;justify-content:space-between;gap:24px;min-height:220px;margin:0 0 20px;padding:0 0 0 48px;overflow:hidden;border-radius:28px;color:#fff;
  background:radial-gradient(circle at 88% 10%,rgba(255,255,255,.14),transparent 42%),linear-gradient(120deg,#4E0F1A 0%,#6E1B2C 100%);box-shadow:0 14px 36px rgba(78,15,26,.22)}
.hhero h1{align-self:center;min-width:0;margin:0;padding:32px 0;font:700 clamp(28px,4.4vw,48px)/1.15 "PT Serif",Georgia,serif;color:#fff;text-wrap:balance;overflow-wrap:break-word}
.hhero img{flex:none;display:block;width:var(--img-w);transform:translate(var(--img-x),var(--img-y));align-self:stretch;height:auto;object-fit:cover;object-position:center top}
.hpanel{background:#fff;border-radius:28px;padding:36px 40px 32px;box-shadow:0 10px 34px rgba(78,15,26,.10)}
.hpanel .hcards{margin-bottom:14px}
.hpanel .tabs{margin-bottom:0}
@media (max-width:520px){.hhero{--img-w:34%;min-height:150px;gap:14px;padding:0 0 0 20px;border-radius:22px}.hhero h1{padding:22px 0}.hpanel{padding:24px 18px;border-radius:22px}body.home main{padding-top:2px}}
button.ghost{display:inline-flex;align-items:center;gap:6px;flex:none;min-height:40px;padding:0 10px;border:0;border-radius:999px;
  background:transparent;color:var(--mu);font:600 13px/1 "PT Sans",sans-serif;cursor:pointer;transition:background .15s,color .15s}
button.ghost svg{width:15px;height:15px;flex:none}
button.ghost:hover,button.ghost.on{color:var(--ac)}
button.ghost:hover{background:rgba(78,15,26,.07)}
.tabs button.ghost{margin-left:auto}
.mbar{display:flex;gap:4px;flex-wrap:wrap;margin:-4px 0 8px}
.dim{opacity:.55}
.tact{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.tact .fbtn{min-height:34px;font-size:13px;padding:0 14px}
.fbk{max-width:var(--w,860px);margin:0 auto;padding:4px 16px 32px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;color:var(--mu);font-size:14px}
.fbk[hidden]{display:none}
dialog.dlg{border:0;border-radius:14px;padding:0;width:min(560px,calc(100% - 24px));max-height:calc(100% - 24px);background:var(--sf);color:var(--tx);box-shadow:0 12px 40px rgba(0,0,0,.35)}
dialog.dlg::backdrop{background:rgba(30,6,10,.55)}
.dh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px 6px;margin:0}
.dh h3{margin:0;font:700 19px/1.25 "PT Serif",Georgia,serif}
.dh button{border:0;background:transparent;color:var(--mu);font:400 28px/1 "PT Sans",sans-serif;cursor:pointer;padding:0 6px}

<script>
/* =====================================================================
   3. ДАННЫЕ — ВСЁ СОДЕРЖАНИЕ ТРЕНАЖЁРА
   =====================================================================
   Структура: D = список модулей. Каждый модуль состоит из трёх частей:

   n  : название модуля (показывается в заголовке)
   th : ТЕОРИЯ — список тем в формате  ["Название темы", "Текст темы"],
        СЛАЙДЫ / КАРТИНКИ (необязательно): третьим элементом добавьте список картинок —
        ["Название темы", "Текст темы", ["slide1.jpg","slide2.jpg","slide3.jpg"]],
        они покажутся под текстом и будут листаться свайпом, стрелками или клавишами ← →.
        Если нужны только слайды без текста — оставьте текст пустым: ["Название темы", "", ["slide1.jpg","slide2.jpg"]].
        Одна картинка тоже подойдёт: ["slide1.jpg"].
        Как получить слайды: в PowerPoint «Файл → Экспорт → Изменить тип файла → JPEG/PNG → Все слайды»,
        положите файлы рядом с этой страницей и укажите имена (например "slides/1.jpg").
   q  : ТЕСТ   — список вопросов в формате
        ["Вопрос", ["вариант 0","вариант 1","вариант 2"], НОМЕР_ВЕРНОГО, "Пояснение"],
        НОМЕР_ВЕРНОГО считается с нуля: первый вариант = 0, второй = 1, третий = 2.
         ТЕСТЫ МОЖНО И НЕ ПИСАТЬ В КОДЕ: вкладка «Тест» → «Режим редактора» → загрузить таблицу Excel/CSV
         (понадобится apps_script_tests.gs, см. инструкцию в этом файле).
   k  : КЕЙС   — ["Описание ситуации", [
          ["Вариант решения", 0, "Разбор: почему не лучший"],
          ["Вариант решения", 1, "Разбор: почему верный"],   // 1 = верный, 0 = неверный
        ]]

   ПРАВИЛА (иначе страница перестанет работать):
   • Каждый элемент заканчивается запятой, кроме последнего в списке.
   • Внутри текста НЕ используйте прямые кавычки " — вместо них пишите «ёлочки».
   • В тексте теории можно использовать теги: <b>жирный</b>, <i>курсив</i>, <br> (перенос строки).
   • В кейсе должен быть ровно один верный вариант (с цифрой 1).

   КАК ДОБАВИТЬ:
   • тему теории   — скопируйте любую строку ["Название","Текст"], внутри th:[ ... ]
   • вопрос теста  — скопируйте любую строку вопроса, внутри q:[ ... ]
   • новый модуль  — скопируйте весь блок от { до }, и вставьте после запятой в конце предыдущего
   ===================================================================== */
/* ╔═══ РАЗДЕЛЫ ВЕРХНЕГО МЕНЮ ═══╗
   Для каждого раздела перечислены номера модулей, которые в нём показываются.
   Чтобы перенести модуль в другой раздел — поменяйте номер в нужном списке.
   Пустой список [] = раздел в разработке (покажется заглушка). */
const ROLES=[
 {id:'seller',t:'Продавцам',mods:[]},
 {id:'admin',t:'Администратору',mods:['2.1','2.2','2.3','2.4']},
 {id:'sup',t:'Супервайзеру',mods:['1.1','1.2','1.3','1.4','1.5','1.6','1.7']}
];

/* МОДУЛИ В КОДЕ УДАЛЕНЫ: теперь модули, теорию, тесты, кейсы и материалы создаёт редактор прямо на странице
   (кнопка «Режим редактора» → «+ Модуль»). Если нужно вернуть прежние модули из кода — используйте файл index_backup_with_modules.html. */
const D0=[];
let D=D0.slice(); /* D = модули из кода + модули, созданные на странице (собирается в buildD) */
/* =====================================================================
   4. ДВИЖОК — код страницы (редактировать не нужно)
   nav()  — рисует кнопки модулей
   draw() — рисует выбранный модуль: вкладки «Теория / Тест / Кейс»
   ===================================================================== */
const m=document.getElementById('m'),nv=document.getElementById('nav');let cur=0,tab='th',view='home'; /* view: 'home' — главная, 'mod' — модули выбранного раздела */
/* ===== SUPABASE: вставьте адрес проекта и публичный ключ (Project Settings -> API) ===== */
const SUPABASE_URL=(()=>{try{return new URL(String((window.PORTAL_CONFIG||{}).url||'').trim()).origin}catch(e){return''}})(),SUPABASE_KEY=String((window.PORTAL_CONFIG||{}).key||'').trim();
const CFG_URL='supabase';
const sb=/^https?:/.test(SUPABASE_URL)?supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
let CAN_EDIT=false,CAN_REP=false,URLS={};
const mapT=r=>({id:String(r.id),module:r.module_id,key:r.key||'',title:r.title,text:r.body||'',pos:Number(r.sort)||0,del:!!r.hidden,by:'',date:r.updated_at||''});
const mapM=r=>({id:r.id,code:r.id,title:r.title,role:r.section,k:r.case_data||null,hidden:!!r.hidden,requires:r.requires||[],by:'',date:r.updated_at||''});
const mapF=r=>({id:r.id,date:r.created_at,module:r.module_id||'',title:r.title||r.name,name:r.name,fileId:String(r.id),size:r.size_bytes||0,by:'',place:r.place==='theory'?'theory':'files',path:r.storage_path});
async function signFiles(list){if(!list.length)return;const paths=list.map(f=>f.path),B=sb.storage.from('materials');
  const [a,b]=await Promise.all([B.createSignedUrls(paths,21600),B.createSignedUrls(paths,21600,{download:true})]);
  const va={},vb={};(a.data||[]).forEach(x=>{va[x.path]=x.signedUrl});(b.data||[]).forEach(x=>{vb[x.path]=x.signedUrl});
  list.forEach(f=>{URLS['v'+f.fileId]=va[f.path]||'';URLS['d'+f.fileId]=vb[f.path]||''})}
async function listFiles(){const r=await sb.from('files').select('*').order('created_at');if(r.error)throw r.error;const l=r.data.map(mapF);await signFiles(l);return l}
async function fetchTests(id){let q=sb.from('tests').select('id,module_id,title,created_at,pass_percent,max_attempts,questions(id,sort,text,options)').order('created_at');if(id)q=q.eq('id',id);
  const r=await q;if(r.error)throw r.error;
  return r.data.map(x=>({id:x.id,module:x.module_id,title:x.title,date:x.created_at,by:'',pass:x.pass_percent,max:x.max_attempts,q:x.questions.sort((a,b)=>a.sort-b.sort).map(y=>[y.text,y.options,-1,'',y.id])}))}
async function fetchContent(){const [a,b]=await Promise.all([sb.from('modules').select('*'),sb.from('topics').select('*').order('sort')]);
  if(a.error||b.error)throw (a.error||b.error);return{modules:a.data.map(mapM),topics:b.data.map(mapT)}}
async function sbApi(o){switch(o.action){
 case 'check':return{ok:CAN_EDIT};
 case 'feedback':{const r=parseInt(o.rating,10),x=await sb.from('feedback').insert({rating:(r>=1&&r<=5)?r:null,message:String(o.message||'').slice(0,2000),module:String(o.module||'').slice(0,150),topic:String(o.topic||'').slice(0,40)});if(x.error)throw x.error;return{ok:true}}
 case 'file_rename':{const x=await sb.from('files').update({title:String(o.title||'').slice(0,120)}).eq('id',o.id);if(x.error)throw x.error;return{ok:true}}
 case 'test_save':{const x=await sb.rpc('save_test',{p_module:o.module,p_title:o.title,p_q:o.q});if(x.error)throw x.error;return{ok:true,test:(await fetchTests(x.data.id))[0]}}
 case 'test_settings':{const pc=parseInt(o.pass,10),mx=(o.max===''||o.max==null)?null:parseInt(o.max,10);
  if(!(pc>=1&&pc<=100)||(mx!==null&&!(mx>=1)))return{ok:false,error:'data'};
  const x=await sb.from('tests').update({title:String(o.title||'Тест').slice(0,120),pass_percent:pc,max_attempts:mx}).eq('id',o.id).select().single();if(x.error)throw x.error;return{ok:true}}
 case 'test_delete':{const x=await sb.from('tests').delete().eq('id',o.id);if(x.error)throw x.error;return{ok:true}}
 case 'topic_save':{const row={module_id:o.module,title:o.title,body:o.text||'',hidden:!!o.del};let id=o.id?String(o.id):'';
  if(!id&&o.key){const q=await sb.from('topics').select('id').eq('module_id',o.module).eq('key',o.key).maybeSingle();if(q.data)id=String(q.data.id)}
  const x=id?await sb.from('topics').update(row).eq('id',id).select().single():await sb.from('topics').insert(Object.assign(row,{key:o.key||null,sort:Date.now()})).select().single();
  if(x.error)throw x.error;return{ok:true,topic:mapT(x.data)}}
 case 'topic_delete':{const x=await sb.from('topics').delete().eq('id',o.id);if(x.error)throw x.error;return{ok:true}}
 case 'module_save':{const hasK=Object.prototype.hasOwnProperty.call(o,'k');let x;
  if(o.id){const p={};if(o.title!=null)p.title=o.title;if(o.role!=null)p.section=o.role;if(hasK)p.case_data=o.k;if(o.hidden!=null)p.hidden=!!o.hidden;if(o.requires)p.requires=o.requires;x=await sb.from('modules').update(p).eq('id',o.id).select().single()}
  else{const c=String(o.code||'').trim();if(!/^\d{1,3}(\.\d{1,3}){0,2}$/.test(c))return{ok:false,error:'data'};
   x=await sb.from('modules').insert({id:c,section:o.role,title:o.title,sort:0,case_data:hasK?o.k:null,hidden:o.hidden!=null?!!o.hidden:true,requires:o.requires||[]}).select().single()}
  if(x.error)throw x.error;return{ok:true,module:mapM(x.data)}}
 case 'module_delete':{await sb.from('topics').delete().eq('module_id',o.id);const x=await sb.from('modules').delete().eq('id',o.id);if(x.error)throw x.error;return{ok:true}}
 case 'upload':{const name=String(o.name||'').replace(/[\\\/:*?"<>|]/g,'_').slice(0,120),ext=name.split('.').pop().toLowerCase();
  if(!name||!EXTS.includes(ext))return{ok:false,error:'type'};
  let blob=o.blob;if(!blob){const bin=atob(o.data||''),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);blob=new Blob([arr],{type:o.mime||'application/octet-stream'})}
  if(!blob.size||blob.size>MAXMB*1048576)return{ok:false,error:'size'};
  const path=Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)+'.'+ext,mime=o.mime||'application/octet-stream';
  const up=await sb.storage.from('materials').upload(path,blob,{contentType:mime});if(up.error)throw up.error;
  const x=await sb.from('files').insert({module_id:String(o.module||'')||null,name:name,storage_path:path,mime:mime,size_bytes:blob.size,title:String(o.title||name).slice(0,120),place:o.place==='theory'?'theory':'files',created_by:ME.id}).select().single();
  if(x.error){await sb.storage.from('materials').remove([path]);throw x.error}
  const f=mapF(x.data);await signFiles([f]);return{ok:true,file:f,shared:true}}
 case 'delete':{const q=await sb.from('files').select('storage_path').eq('id',o.id).single();if(q.error)throw q.error;
  await sb.storage.from('materials').remove([q.data.storage_path]);const x=await sb.from('files').delete().eq('id',o.id);if(x.error)throw x.error;return{ok:true}}
 }return{ok:false,error:'action'}}
async function api(o){try{return await sbApi(o)}catch(e){console.error(e);const m=(e&&e.message)||'';return{ok:false,error:(e&&e.code==='23505')?'dup':/rate_limit/.test(m)?'limit':'fail'}}}
let ATT=[];

function buildP(){P={};PP={};ATT.forEach(a=>{const d=D.find(x=>code(x)==String(a.module_id));if(d){setP(d.n,a.kind=='case'?'Кейс':'Тест',a.percent);if(a.kind=='test'&&a.passed)PP[d.n]=1}})}

const PASS=70;
const ls={g(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let U=null,P={},ME=null;
let R=ls.g('shk_r','admin');if(!ROLES.some(r=>r.id==R))R=ROLES[0].id;
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const code=d=>d.n.split(' ')[0];
/* ===== Модули и разделы, созданные на странице (хранятся в таблице; см. apps_script_tests.gs) ===== */
let MODS=ls.g('sb_m',[]),TOPICS=ls.g('sb_tp',[]);
const cmpCode=(a,b)=>{const x=a.split('.').map(Number),y=b.split('.').map(Number);for(let i=0;i<Math.max(x.length,y.length);i++){const d=(x[i]||0)-(y[i]||0);if(d)return d}return 0};
const nh=d=>d.page?esc(d.n):d.n;
function buildD(){D=D0.concat(MODS.filter(m=>m&&m.code&&!D0.some(x=>code(x)==String(m.code))).map(m=>({n:m.code+' '+m.title,th:[],q:[],page:true,hid:!!m.hidden,req:m.requires||[],id:m.id,role:m.role,ttl:m.title,cd:String(m.code),
  kRaw:m.k||null,k:m.k?[esc(m.k[0]),m.k[1].map(o=>[esc(o[0]),o[1]?1:0,esc(o[2])])]:null})))}
const inRole=rid=>{const r=ROLES.find(r=>r.id==(rid||R))||ROLES[0];return D.map((d,i)=>i).filter(i=>D[i].page?D[i].role==r.id:r.mods.includes(code(D[i]))).sort((a,b)=>cmpCode(code(D[a]),code(D[b])))};
function setD(keepN){const k=keepN!==undefined?keepN:(cur>=0&&D[cur]?D[cur].n:null);buildD();const i=k==null?-1:D.findIndex(x=>x.n==k),l=inRole();cur=l.includes(i)?i:(l.length?l[0]:-1)}
buildD();
const initials=n=>n.trim().split(/\s+/).slice(0,2).map(w=>w[0]||'').join('').toUpperCase();
/* верхнее меню: блок пользователя и разделы */
function renderTop(){const u=document.getElementById('user'),r=document.getElementById('roles'),fk=document.getElementById('fbk');if(fk)fk.hidden=!U||!CFG_URL;

async function vPdf(box,f){await needPdf();const pdf=await pdfjsLib.getDocument({data:await getBuf(f)}).promise,N=pdf.numPages;let n=1,busy=false;

   cv.width=vp.width;cv.height=vp.height;await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;sp.textContent=k+' / '+N}while(k!=n)}finally{busy=false}};

 else{box.innerHTML='<img class="emb-img timg" style="max-width:100%;max-height:none" src="'+furl.view(f)+'" alt="'+esc(f.title||f.name)+'" loading="lazy">';return}
 job.then(()=>wireFs(box)).catch(fail)}

 v.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(!confirm('Удалить файл? Он будет удалён безвозвратно.'))return;b.disabled=true;

 const ff=document.getElementById('ff'),fl=document.getElementById('fl'),dz=document.getElementById('fdz'),fu=document.getElementById('fu');if(!fu)return;
 const pick=L=>{PICK=[...L];fl.textContent=PICK.length?PICK.map(f=>f.name+' ('+fsize(f.size)+')').join(' · '):''};
 ff.onchange=()=>pick(ff.files);

 ['dragleave','drop'].forEach(n=>dz.addEventListener(n,e=>{e.preventDefault();dz.classList.remove('on')}));

 fu.onclick=async()=>{const L=PICK.slice(),t=document.getElementById('ft').value.trim();if(!L.length){say('Выберите файлы.');return}
  const bad=L.find(f=>!EXTS.includes(fext(f.name)));if(bad){say('Такой тип файла не разрешён: '+bad.name);return}
  const big=L.find(f=>f.size>MAXMB*1048576);if(big){say('Файл «'+big.name+'» больше '+MAXMB+' МБ. Сожмите его или сохраните в PDF.');return}
  fbusy=true;fu.disabled=true;let ok=0;
  for(let i=0;i<L.length;i++){const f=L[i];say('Загружаю '+(i+1)+' из '+L.length+': '+f.name+'… не закрывайте страницу.');
   const j=await api({action:'upload',place:place,module:c,title:(L.length==1&&t)||f.name.replace(/\.[^.]+$/,''),name:f.name,mime:f.type||'application/octet-stream',blob:f,by:U.name});
   if(j.ok){FILES.push(j.file);ok++}else{say('Не удалось загрузить «'+f.name+'»: '+(j.error=='size'?'слишком большой файл.':j.error=='type'?'тип файла не разрешён.':'ошибка связи или прав.'));break}}
  fbusy=false;fu.disabled=false;PICK=[];if(ok)draw()}}

/* ===== ЗАГРУЖАЕМЫЕ ТЕСТЫ =====
   Редактор выбирает файл Excel (.xlsx, .xls) или CSV прямо на вкладке «Тест» — тест появляется у всех пользователей.
   Формат таблицы (первая строка — заголовки, её можно оставить):
   A «Вопрос» | B–F «Вариант 1…5» (от 2 до 5 заполненных) | G «Верный вариант» (номер: 1, 2, 3…) | H «Пояснение».
   Загруженные тесты хранятся в таблице Google через Apps Script (файл apps_script_tests.gs). */
let TESTS=ls.g('sb_t',[]),tsel={};
const MAXQ=100,TEXTS=['xlsx','xls','csv'];
function loadTests(){if(!CFG_URL)return;const was=JSON.stringify(TESTS);
  fetchTests().then(x=>{TESTS=x;ls.s('sb_t',[])}).catch(()=>{})
  .then(()=>{if(U&&!fbusy&&(view=='home'||(cur>=0&&tab=='t'))&&was!=JSON.stringify(TESTS)&&!document.querySelector('#v input:checked'))draw()})}
function csvRows(t){t=t.replace(/^\uFEFF/,'');const f=t.split(/\r?\n/)[0]||'',cnt=ch=>f.split(ch).length-1,dl=[';','\t',','].sort((a,b)=>cnt(b)-cnt(a))[0];
  const rows=[];let r=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
   if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
   else if(ch=='"')q=true;
   else if(ch==dl){r.push(c);c=''}
   else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';rows.push(r);r=[]}
   else c+=ch}
  if(c!==''||r.length){r.push(c);rows.push(r)}
  return rows}
const decodeBuf=b=>{try{return new TextDecoder('utf-8',{fatal:true}).decode(b)}catch(e){return new TextDecoder('windows-1251').decode(b)}};
const needXlsx=()=>window.XLSX?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=()=>no(new Error('xlsx'));document.head.appendChild(s)});
function readTable(f){return new Promise((ok,no)=>{const rd=new FileReader();rd.onerror=()=>no(new Error('read'));
  rd.onload=()=>{if(fext(f.name)=='csv')return ok(csvRows(decodeBuf(rd.result)));
   needXlsx().then(()=>{const wb=XLSX.read(rd.result,{type:'array'});ok(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:false}))}).catch(()=>no(new Error('xlsx')))};
  rd.readAsArrayBuffer(f)})}
/* строки таблицы → вопросы в том же формате, что и в блоке «Данные»: [вопрос, [варианты], номер_верного_с_нуля, пояснение] */
function parseTest(rows){const q=[],err=[];
  rows.forEach((r,i)=>{r=r.map(x=>x==null?'':String(x).trim());if(r.every(x=>!x))return;
   if(/^вопрос/i.test(r[0])&&!/^\d+$/.test(r[6]||''))return;
   const n=i+1,o=[];for(let j=1;j<=5;j++)if(r[j])o.push([j,r[j]]);
   const k=parseInt(r[6],10),at=o.findIndex(x=>x[0]==k);
   if(!r[0])err.push('Строка '+n+': нет текста вопроса.');
   else if(o.length<2)err.push('Строка '+n+': нужно минимум два варианта ответа.');
   else if(at<0)err.push('Строка '+n+': в колонке «Верный вариант» укажите номер заполненного варианта (1–5).');
   else q.push([r[0],o.map(x=>x[1]),at,r[7]||('Верный ответ: '+o[at][1])])});
  if(!q.length&&!err.length)err.push('В файле не найдено ни одного вопроса.');
  if(q.length>MAXQ)err.push('Слишком много вопросов: максимум '+MAXQ+'.');
  return{q,err}}
function tmplCsv(){const L=['Вопрос;Вариант 1;Вариант 2;Вариант 3;Вариант 4;Вариант 5;Верный вариант (номер);Пояснение',
  'Что отличает руководителя от специалиста?;Больше личной экспертизы;Результат достигается через других людей;Меньше ответственности;;;2;Руководитель отвечает за результат команды.',
  'Какой стиль подходит новичку?;Либеральный;Директивный;Отказ от управления;;;2;Неопытному сотруднику нужны чёткие указания.'];
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+L.join('\r\n')],{type:'text/csv;charset=utf-8'}));a.download='шаблон_теста.csv';document.body.appendChild(a);a.click();a.remove()}
/* форма редактора на вкладке «Тест»: список загруженных тестов + загрузка нового */
function tedHtml(c,list){if(!CFG_URL||!PIN)return'';
  return '<div class="q fm" style="margin-top:14px"><div class="edbar"><b>Редактор: тесты модуля</b></div>'
   +list.map(t=>{const dt=new Date(t.date);return '<div class="fc"><div class="fb"><b>'+esc(t.title)+'</b><span class="ex">Вопросов: '+t.q.length+' · зачёт '+t.pass+'% · попыток: '+(t.max||'без лимита')+(isNaN(dt)?'':' · '+dt.toLocaleDateString('ru-RU'))+'</span></div><div class="fa"><button class="fbtn alt" type="button" data-tset="'+esc(t.id)+'">Настройки</button><button class="fbtn alt" type="button" data-tq="'+esc(t.id)+'">Вопросы</button><button class="fbtn del" type="button" data-tdel="'+esc(t.id)+'">Удалить</button></div></div>'}).join('')
   +'<input id="tt" maxlength="120" placeholder="Название теста (необязательно)"><input id="tf" type="file" accept=".xlsx,.xls,.csv">'
   +'<div class="ex" style="margin:0 0 10px">Таблица Excel или CSV: один вопрос в строке. Колонки: A — вопрос, B–F — варианты ответа (от 2 до 5), G — номер верного варианта, H — пояснение. До '+MAXQ+' вопросов.</div>'
   +'<div class="fa" style="margin:0 0 10px"><button class="fbtn alt" id="tn" type="button">Скачать шаблон</button></div>'
   +'<div class="fmsg" id="tg" role="status"></div><button class="btn" id="tu" type="button">Загрузить тест в модуль '+esc(c)+'</button></div>'}
function wireTests(v,c){
  const say=t=>{const g=document.getElementById('tg');if(g)g.textContent=t};
  v.querySelectorAll('[data-tdel]').forEach(b=>b.onclick=()=>{if(!confirm('Удалить этот тест?'))return;b.disabled=true;
   api({action:'test_delete',pin:PIN,id:b.dataset.tdel}).then(j=>{if(j.ok){TESTS=TESTS.filter(x=>String(x.id)!=b.dataset.tdel);ls.s('sb_t',TESTS);delete tsel[c];draw()}else{if(j.error=='pin')setPin('');alert('Не удалось удалить.');draw()}}).catch(()=>{alert('Нет связи с сервером.');b.disabled=false})});
  const tn=document.getElementById('tn');if(tn)tn.onclick=tmplCsv;
  v.querySelectorAll('[data-tset]').forEach(b=>b.onclick=()=>testSetDlg(TESTS.find(x=>String(x.id)==b.dataset.tset)));
  v.querySelectorAll('[data-tq]').forEach(b=>b.onclick=()=>qEditDlg(TESTS.find(x=>String(x.id)==b.dataset.tq)));
  const tu=document.getElementById('tu');if(tu)tu.onclick=()=>{const f=document.getElementById('tf').files[0],t=document.getElementById('tt').value.trim();
   if(!f){say('Выберите файл.');return}
   if(!TEXTS.includes(fext(f.name))){say('Нужен файл Excel (.xlsx, .xls) или CSV.');return}
   if(f.size>2*1048576){say('Файл слишком большой для теста.');return}
   fbusy=true;tu.disabled=true;say('Читаю файл…');
   readTable(f).then(rows=>{const p=parseTest(rows);
    if(p.err.length){fbusy=false;tu.disabled=false;say(p.err.slice(0,5).join(' ')+(p.err.length>5?' …и ещё ошибок: '+(p.err.length-5):''));return}
    say('Загрузка… не закрывайте страницу.');
    return api({action:'test_save',pin:PIN,module:c,title:t||f.name.replace(/\.[^.]+$/,''),q:p.q,by:U.name}).then(j=>{fbusy=false;
     if(j.ok){TESTS.push(j.test);ls.s('sb_t',TESTS);tsel[c]=String(j.test.id);draw()}
     else{tu.disabled=false;if(j.error=='pin'){setPin('');alert('Код редактора больше не подходит. Войдите заново.');draw()}else say(j.error=='size'?'Тест слишком большой.':'Ошибка загрузки.')}})})
   .catch(e=>{fbusy=false;tu.disabled=false;say(e&&e.message=='xlsx'?'Не удалось открыть Excel-файл. Сохраните таблицу как CSV и загрузите снова.':e&&e.message=='read'?'Не удалось прочитать файл.':'Нет связи с сервером. Проверьте интернет и что опубликована новая версия скрипта.')})}}
/* вкладка ТЕСТ: основной тест из блока «Данные» + загруженные со страницы; кнопка «Проверить знания», подсчёт и результат (блок .res) */
function testTab(d,v){const c=code(d),list=TESTS.filter(t=>String(t.module)==c&&Array.isArray(t.q)&&t.q.length);
  const main=d.q&&d.q.length;let T=list.find(t=>String(t.id)==tsel[c]);if(!T&&!main&&list.length)T=list[0];const Q=T?T.q:(d.q||[]),ty=T?'Тест: '+T.title:'Тест',X=T?esc:z=>z;
  const chips=list.length>(main?0:1)?'<div class="chips" role="group" aria-label="Выбор теста">'+(main?[['','Основной тест']]:[]).concat(list.map(t=>[String(t.id),t.title])).map(x=>'<button type="button" aria-pressed="'+((T?String(T.id):'')==x[0])+'" data-ts="'+esc(x[0])+'">'+esc(x[1])+'</button>').join('')+'</div>':'';
  if(!Q.length){v.innerHTML='<div class="empty">Тестов в этом модуле пока нет.</div>'+tedHtml(c,list);wireTests(v,c);return}
  v.innerHTML=chips+tinfo(T)+Q.map((q,i)=>'<div class="q"><b>'+(i+1)+'. '+X(q[0])+'</b>'+q[1].map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+X(o)+'</label>').join('')+'<div class="ex" hidden></div></div>').join('')+'<div id="r"></div><button class="btn" id="ck">Проверить знания</button>'+tedHtml(c,list);
  v.querySelectorAll('[data-ts]').forEach(b=>b.onclick=()=>{tsel[c]=b.dataset.ts;draw()});
  document.getElementById('ck').onclick=()=>{if(!T)return;const qs=v.querySelectorAll('.q:not(.fm)'),RS=document.getElementById('r'),ck=document.getElementById('ck');let un=0;qs.forEach(e=>{if(!e.querySelector('input:checked'))un++});
   if(un){RS.innerHTML='<div class="res">Ответьте на все вопросы: не отвечено '+un+'.</div>';return}
   const ans={};qs.forEach((e,i)=>{ans[Q[i][4]]=+e.querySelector('input:checked').value});
   ck.disabled=true;RS.innerHTML='<div class="res">Проверяю…</div>';
   sb.rpc('submit_test',{p_test_id:T.id,p_answers:ans}).then(({data,error})=>{ck.disabled=false;
    if(error||!data){RS.innerHTML='<div class="res">'+(/attempts_exhausted/.test((error&&error.message)||'')?'Лимит попыток по этому тесту исчерпан.':/prereq_not_met/.test((error&&error.message)||'')?'Сначала нужно пройти предыдущие модули.':'Не удалось проверить тест. Проверьте связь и попробуйте ещё раз.')+'</div>';return}
    const rv={};data.review.forEach(x=>{rv[x.question_id]=x});
    qs.forEach((e,i)=>{const x=rv[Q[i][4]];if(!x)return;e.querySelectorAll('label').forEach((l,j)=>{if(j==x.correct_index)l.classList.add('ok');else if(j==ans[Q[i][4]])l.classList.add('no');l.querySelector('input').disabled=true});const ex=e.querySelector('.ex');ex.hidden=false;ex.textContent=(x.correct?'Верно. ':'Неверно. ')+(x.explanation||'')});
    const p=data.percent;setP(d.n,'Тест',p);if(data.passed)PP[d.n]=1;ATT.push({module_id:T.module,kind:'test',percent:p,test_id:T.id,passed:data.passed});nav();
    RS.innerHTML='<div class="res">Результат: <strong>'+data.correct+' из '+data.total+'</strong> ('+p+'%). '+(p==100?'Отлично, модуль освоен.':data.passed?'Хорошо, повторите ошибочные темы.':'Нужно повторить теорию и пройти тест снова.')+'</div>';
    ck.textContent='Пройти заново';ck.onclick=draw;RS.scrollIntoView({behavior:'smooth'})})};
  wireTests(v,c)}
/* ===== МИНИ-РАЗМЕТКА ТЕКСТА РАЗДЕЛОВ: Enter = новая строка, **жирный**, __курсив__ =====
   В таблицу текст сохраняется в этом виде, на странице превращается в безопасный HTML. */
const h2m=h=>String(h||'').replace(/<br\s*\/?>/gi,'\n').replace(/<\/?(b|strong)>/gi,'**').replace(/<\/?(i|em)>/gi,'__').replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&');
const thumb=(id,w)=>URLS['v'+id]||'';
const isImg=f=>/^img_/.test(f.name||''); /* служебные файлы-картинки из текста разделов: в «Материалы» не показываем */
/* [img:ID] в тексте раздела = картинка с Диска (маркер ставит кнопка «Добавить картинку») */
const m2h=t=>{const im=[];let h=esc(t).replace(/\r?\n?\[img:([\w-]+)\]\r?\n?/g,(_,id)=>{im.push(id);return '\u0001'+(im.length-1)+'\u0001'});
  h=h.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/__(.+?)__/g,'<i>$1</i>').replace(/\r?\n/g,'<br>');
  return h.replace(/\u0001(\d+)\u0001/g,(_,i)=>'<img class="timg" src="'+thumb(im[+i],1200)+'" data-full="'+thumb(im[+i],2000)+'" alt="Иллюстрация" loading="lazy">')};
const up=(a,x)=>{const i=a.findIndex(y=>String(y.id)==String(x.id));if(i<0)a.push(x);else a[i]=x;return a};
const PENCIL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';

/* действие редактора: отправка на сервер с кодом; say — куда писать ошибку, fail — что сделать при неудаче */
function act(o,onok,say,fail){o.pin=PIN;o.by=U.name;
  return api(o).then(j=>{if(j.ok)return onok(j);if(fail)fail();
    if(j.error=='pin'){setPin('');closeDlg();nav();alert('Код редактора больше не подходит. Войдите заново.');draw()}
    else if(say)say(j.error=='size'?'Слишком длинный текст.':j.error=='dup'?'Модуль с таким номером уже есть.':'Не удалось сохранить.');else alert('Не удалось выполнить действие.')})
  .catch(()=>{if(fail)fail();say?say('Нет связи с сервером. Проверьте интернет и что опубликована новая версия скрипта.'):alert('Нет связи с сервером.')})}

/* ===== ТЕОРИЯ: загруженные презентации сверху, затем разделы (из кода и добавленные на странице) ===== */
function topicItems(d){const c=code(d),mine=TOPICS.filter(t=>String(t.module)==c),ov=k=>mine.find(t=>t.key&&t.key==k);
  const a=d.th.map(t=>{const o=ov(t[0]);return{src:'code',key:t[0],oid:o?o.id:'',hasOv:!!o,hidden:!!(o&&o.del),titleH:o?esc(o.title):t[0],html:o?m2h(o.text):(t[1]||''),slides:t[2],rawTitle:o?o.title:h2m(t[0]),rawText:o?o.text:h2m(t[1])}});
  const b=mine.filter(t=>!t.key).sort((x,y)=>Number(x.pos)-Number(y.pos)).map(t=>({src:'page',key:'',oid:t.id,hasOv:false,hidden:false,titleH:esc(t.title),html:m2h(t.text),slides:null,rawTitle:t.title,rawText:t.text}));
  return a.concat(b)}
function theoryTab(d,v){const c=code(d),files=FILES.filter(f=>String(f.module)==c&&f.place=='theory'),items=topicItems(d).filter(it=>PIN||!it.hidden),E=PIN&&CFG_URL;
  const acts=(it,i)=>'<div class="tact">'+(it.hidden?'<button class="fbtn alt" type="button" data-ta="show" data-i="'+i+'">Показать</button>':'<button class="fbtn alt" type="button" data-ta="edit" data-i="'+i+'">Изменить текст</button>')

/* ===== КАРТИНКИ В РАЗДЕЛАХ: выбранный файл уменьшается до 1600 px, сохраняется как JPG и грузится на Диск (как обычный файл, но с именем img_…) ===== */
function shrinkImage(f,max){return new Promise((ok,no)=>{const u=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{URL.revokeObjectURL(u);let w=im.naturalWidth,h=im.naturalHeight;if(!w||!h)return no(new Error('img'));const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
   const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);ok(c.toDataURL('image/jpeg',0.85).split(',')[1])};
  im.onerror=()=>{URL.revokeObjectURL(u);no(new Error('img'))};im.src=u})}
function uploadImage(f,c){return shrinkImage(f,1600).then(data=>api({action:'upload',pin:PIN,place:'files',module:c,title:'Картинка',name:'img_'+Date.now().toString(36)+'.jpg',mime:'image/jpeg',data:data,by:U.name}))
  .then(j=>{if(!j.ok){const e=new Error(j.error||'x');e.code=j.error;throw e}if(j.shared===false)alert('Картинка загружена, но Google запретил общий доступ по ссылке. Другие пользователи её не увидят: проверьте настройки доступа Диска.');return j.file.fileId})}

     +'<input data-f="e" placeholder="Пояснение к ответу (необязательно)" value="'+esc(q.e)+'"><div class="fa">'
     +(q.o.length<5?'<button class="fbtn alt" type="button" data-a="ao">+ вариант</button>':'')+(q.o.length>2?'<button class="fbtn alt" type="button" data-a="ro">− вариант</button>':'')
     +'<button class="fbtn alt" type="button" data-a="up" aria-label="Выше">↑</button><button class="fbtn alt" type="button" data-a="dn" aria-label="Ниже">↓</button><button class="fbtn del" type="button" data-a="del">Удалить</button></div></div>').join('')};
   qe.addEventListener('input',ev=>{const el=ev.target,box=el.closest('[data-i]');if(!box)return;const q=Qs[+box.dataset.i],f=el.dataset.f;if(f=='t')q.t=el.value;else if(f=='e')q.e=el.value;else if(f=='o')q.o[+el.dataset.j]=el.value});
   qe.addEventListener('change',ev=>{const el=ev.target,box=el.closest('[data-i]');if(box&&el.dataset.f=='c')Qs[+box.dataset.i].c=+el.dataset.j});
   qe.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(!b)return;const i=+b.closest('[data-i]').dataset.i,q=Qs[i],a=b.dataset.a;
    if(a=='ao'&&q.o.length<5)q.o.push('');
    else if(a=='ro'&&q.o.length>2){q.o.pop();if(q.c>=q.o.length)q.c=0}
    else if(a=='up'&&i>0)Qs.splice(i-1,0,Qs.splice(i,1)[0]);
    else if(a=='dn'&&i<Qs.length-1)Qs.splice(i+1,0,Qs.splice(i,1)[0]);
    else if(a=='del'){if(!confirm('Удалить вопрос '+(i+1)+'?'))return;Qs.splice(i,1)}
    paint()});
   d.querySelector('#qa').onclick=()=>{if(Qs.length>=100){say('Максимум 100 вопросов.');return}Qs.push({t:'',o:['',''],c:0,e:''});paint();qe.lastElementChild.scrollIntoView({block:'center'})};
   d.querySelector('#qs').onclick=()=>{if(!Qs.length){say('В тесте должен остаться хотя бы один вопрос.');return}
    const bad=Qs.findIndex(q=>!q.t.trim()||q.o.some(o=>!o.trim()));if(bad>=0){say('Вопрос '+(bad+1)+': заполните текст и все варианты.');return}
    say('Сохраняю…');
    sb.rpc('replace_test_questions',{p_test_id:T.id,p_q:Qs.map(q=>[q.t.trim(),q.o.map(o=>o.trim()),q.c,q.e.trim()||('Верный ответ: '+q.o[q.c].trim())])}).then(x=>{
     if(x.error){say('Не удалось сохранить. Проверьте, что выполнена миграция 6.');return}
     fetchTests(T.id).then(nt=>{const i=TESTS.findIndex(y=>String(y.id)==String(T.id));if(i>=0&&nt[0])TESTS[i]=nt[0];d.close();draw()})})};
   paint()})})}
async function boot(){
 if(!sb){document.body.classList.remove('home');m.innerHTML='<h2>Портал не настроен</h2><div class="q fm"><p>Откройте файл config.js в репозитории и впишите адрес проекта Supabase и публичный ключ (Publishable key).</p></div>';return}
 try{const s=await sb.auth.getSession();const session=s.data&&s.data.session;
  if(session){const q=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
   if(q.data&&(await sb.rpc('is_active_user')).data===false){await sb.auth.signOut();document.body.classList.remove('home');m.innerHTML='<h2>Доступ отключён</h2><div class="q fm"><p>Ваша учётная запись отключена. Обратитесь к администратору.</p></div>';return}
   if(q.data){ME=q.data;U={name:ME.full_name,shop:ME.shop||''};CAN_EDIT=['editor','admin'].includes(ME.role);CAN_REP=['manager','editor','admin'].includes(ME.role);setPin('');await loadAttempts();await loadMine()}
   else{await sb.auth.signOut()}}}catch(e){console.error(e)}
 start()}
boot();
</script></body></html>
