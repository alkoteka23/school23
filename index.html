<script>
/* =====================================================================
   3. ДАННЫЕ — ВСЁ СОДЕРЖАНИЕ ТРЕНАЖЁРА
   =====================================================================
   Структура: D = список модулей. Каждый модуль состоит из трёх частей:

   n  : название модуля (показывается в заголовке)
   th : ТЕОРИЯ — список тем в формате  ["Название темы", "Текст темы"],
        СЛАЙДЫ / КАРТИНКИ (необязательно): третьим элементом добавьте список картинок —
        ["Название темы", "Текст темы", ["slide1.jpg","slide2.jpg","slide3.jpg"]],
        они покажутся под текстом и будут листаться свайпом, стрелками или клавишами ← →.
        Если нужны только слайды без текста — оставьте текст пустым: ["Название темы", "", ["slide1.jpg","slide2.jpg"]].
        Одна картинка тоже подойдёт: ["slide1.jpg"].
        Как получить слайды: в PowerPoint «Файл → Экспорт → Изменить тип файла → JPEG/PNG → Все слайды»,
        положите файлы рядом с этой страницей и укажите имена (например "slides/1.jpg").
   q  : ТЕСТ   — список вопросов в формате
        ["Вопрос", ["вариант 0","вариант 1","вариант 2"], НОМЕР_ВЕРНОГО, "Пояснение"],
        НОМЕР_ВЕРНОГО считается с нуля: первый вариант = 0, второй = 1, третий = 2.
         ТЕСТЫ МОЖНО И НЕ ПИСАТЬ В КОДЕ: вкладка «Тест» → «Режим редактора» → загрузить таблицу Excel/CSV
         (понадобится apps_script_tests.gs, см. инструкцию в этом файле).
   k  : КЕЙС   — ["Описание ситуации", [
          ["Вариант решения", 0, "Разбор: почему не лучший"],
          ["Вариант решения", 1, "Разбор: почему верный"],   // 1 = верный, 0 = неверный
        ]]

   ПРАВИЛА (иначе страница перестанет работать):
   • Каждый элемент заканчивается запятой, кроме последнего в списке.
   • Внутри текста НЕ используйте прямые кавычки " — вместо них пишите «ёлочки».
   • В тексте теории можно использовать теги: <b>жирный</b>, <i>курсив</i>, <br> (перенос строки).
   • В кейсе должен быть ровно один верный вариант (с цифрой 1).

   КАК ДОБАВИТЬ:
   • тему теории   — скопируйте любую строку ["Название","Текст"], внутри th:[ ... ]
   • вопрос теста  — скопируйте любую строку вопроса, внутри q:[ ... ]
   • новый модуль  — скопируйте весь блок от { до }, и вставьте после запятой в конце предыдущего
   ===================================================================== */
/* ╔═══ РАЗДЕЛЫ ВЕРХНЕГО МЕНЮ ═══╗
   Для каждого раздела перечислены номера модулей, которые в нём показываются.
   Чтобы перенести модуль в другой раздел — поменяйте номер в нужном списке.
   Пустой список [] = раздел в разработке (покажется заглушка). */


/* МОДУЛИ В КОДЕ УДАЛЕНЫ: теперь модули, теорию, тесты, кейсы и материалы создаёт редактор прямо на странице

 /* D = модули из кода + модули, созданные на странице (собирается в buildD) */

const { ROLES, D0, WEL_T, WEL_X, HOW_T, HOW_X, PASS, LEVELS, TERR, CERR, ST_RU, CS_RU, ROLE_RU } = window.PORTAL_CONTENT;

/* ===== SUPABASE: вставьте адрес проекта и публичный ключ (Project Settings -> API) ===== */
const SUPABASE_URL=(()=>{try{return new URL(String((window.PORTAL_CONFIG||{}).url||'').trim()).origin}catch(e){return''}})(),SUPABASE_KEY=String((window.PORTAL_CONFIG||{}).key||'').trim();

const mapT=r=>({id:String(r.id),module:r.module_id,key:r.key||'',title:r.title,text:r.body||'',pos:Number(r.sort)||0,del:!!r.hidden,by:'',date:r.updated_at||''});
const mapM=r=>({id:r.id,code:r.id,title:r.title,role:r.section,k:r.case_data||null,hidden:!!r.hidden,requires:r.requires||[],by:'',date:r.updated_at||''});
const mapF=r=>({id:r.id,date:r.created_at,module:r.module_id||'',title:r.title||r.name,name:r.name,fileId:String(r.id),size:r.size_bytes||0,by:'',place:r.place==='theory'?'theory':'files',path:r.storage_path});
async function signFiles(list){if(!list.length)return;const paths=list.map(f=>f.path),B=sb.storage.from('materials');
  const [a,b]=await Promise.all([B.createSignedUrls(paths,21600),B.createSignedUrls(paths,21600,{download:true})]);
  const va={},vb={};(a.data||[]).forEach(x=>{va[x.path]=x.signedUrl});(b.data||[]).forEach(x=>{vb[x.path]=x.signedUrl});
  list.forEach(f=>{URLS['v'+f.fileId]=va[f.path]||'';URLS['d'+f.fileId]=vb[f.path]||''})}
async function listFiles(){const r=await sb.from('files').select('*').order('created_at');if(r.error)throw r.error;const l=r.data.map(mapF);await signFiles(l);return l}
async function fetchTests(id){let q=sb.from('tests').select('id,module_id,title,created_at,pass_percent,max_attempts,time_limit_min,shuffle_questions,shuffle_options,reveal,questions(id,sort,text,options,multi)').order('created_at');if(id)q=q.eq('id',id);
  const r=await q;if(r.error)throw r.error;
  return r.data.map(x=>({id:x.id,module:x.module_id,title:x.title,date:x.created_at,by:'',pass:x.pass_percent,max:x.max_attempts,tm:x.time_limit_min,sq:x.shuffle_questions,so:x.shuffle_options,rv:x.reveal,q:x.questions.sort((a,b)=>a.sort-b.sort).map(y=>[y.text,y.options,-1,'',y.id,!!y.multi])}))}
async function fetchContent(){const [a,b,cc]=await Promise.all([sb.from('modules').select('*'),sb.from('topics').select('*').order('sort'),sb.from('module_cases').select('id,module_id,sort,situation,min_len').order('sort')]);const CL=cc&&!cc.error?cc.data:[];
  if(a.error||b.error)throw (a.error||b.error);return{modules:a.data.map(r=>{const x=mapM(r),l=CL.filter(c=>c.module_id==r.id);x.k=l.length?l:null;return x}),topics:b.data.map(mapT)}}
async function sbApi(o){switch(o.action){
 case 'check':return{ok:CAN_EDIT};
 case 'feedback':{const r=parseInt(o.rating,10),x=await sb.from('feedback').insert({rating:(r>=1&&r<=5)?r:null,message:String(o.message||'').slice(0,2000),module:String(o.module||'').slice(0,150),topic:String(o.topic||'').slice(0,40)});if(x.error)throw x.error;return{ok:true}}
 case 'file_rename':{const x=await sb.from('files').update({title:String(o.title||'').slice(0,120)}).eq('id',o.id);if(x.error)throw x.error;return{ok:true}}
 case 'test_save':{const x=await sb.rpc('save_test',{p_module:o.module,p_title:o.title,p_q:o.q});if(x.error)throw x.error;return{ok:true,test:(await fetchTests(x.data.id))[0]}}
 case 'test_settings':{const pc=parseInt(o.pass,10),mx=(o.max===''||o.max==null)?null:parseInt(o.max,10);
  const tm=(o.tm===''||o.tm==null)?null:parseInt(o.tm,10);
  if(!(pc>=1&&pc<=100)||(mx!==null&&!(mx>=1))||(tm!==null&&!(tm>=1&&tm<=240)))return{ok:false,error:'data'};
  const x=await sb.from('tests').update({title:String(o.title||'Тест').slice(0,120),pass_percent:pc,max_attempts:mx,time_limit_min:tm,shuffle_questions:!!o.sq,shuffle_options:!!o.so,reveal:['always','pass','never'].includes(o.rv)?o.rv:'always'}).eq('id',o.id).select().single();if(x.error)throw x.error;return{ok:true}}
 case 'test_delete':{const x=await sb.from('tests').delete().eq('id',o.id);if(x.error)throw x.error;return{ok:true}}
 case 'topic_save':{const row={module_id:o.module,title:o.title,body:o.text||'',hidden:!!o.del};let id=o.id?String(o.id):'';
  if(!id&&o.key){const q=await sb.from('topics').select('id').eq('module_id',o.module).eq('key',o.key).maybeSingle();if(q.data)id=String(q.data.id)}
  const x=id?await sb.from('topics').update(row).eq('id',id).select().single():await sb.from('topics').insert(Object.assign(row,{key:o.key||null,sort:Date.now()})).select().single();
  if(x.error)throw x.error;return{ok:true,topic:mapT(x.data)}}
 case 'topic_delete':{const x=await sb.from('topics').delete().eq('id',o.id);if(x.error)throw x.error;return{ok:true}}
 case 'module_save':{const hasK=Object.prototype.hasOwnProperty.call(o,'k');let x;
  if(o.id){const p={};if(o.title!=null)p.title=o.title;if(o.role!=null)p.section=o.role;if(hasK)p.case_data=o.k;if(o.hidden!=null)p.hidden=!!o.hidden;if(o.requires)p.requires=o.requires;x=await sb.from('modules').update(p).eq('id',o.id).select().single()}
  else{const c=String(o.code||'').trim();if(!/^\d{1,3}(\.\d{1,3}){0,2}$/.test(c))return{ok:false,error:'data'};
   x=await sb.from('modules').insert({id:c,section:o.role,title:o.title,sort:0,case_data:hasK?o.k:null,hidden:o.hidden!=null?!!o.hidden:true,requires:o.requires||[]}).select().single()}
  if(x.error)throw x.error;return{ok:true,module:mapM(x.data)}}
 case 'module_delete':{await sb.from('topics').delete().eq('module_id',o.id);const x=await sb.from('modules').delete().eq('id',o.id);if(x.error)throw x.error;return{ok:true}}
 case 'upload':{const name=String(o.name||'').replace(/[\\\/:*?"<>|]/g,'_').slice(0,120),ext=name.split('.').pop().toLowerCase();
  if(!name||!EXTS.includes(ext))return{ok:false,error:'type'};
  let blob=o.blob;if(!blob){const bin=atob(o.data||''),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);blob=new Blob([arr],{type:o.mime||'application/octet-stream'})}
  if(!blob.size||blob.size>MAXMB*1048576)return{ok:false,error:'size'};
  const path=Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)+'.'+ext,mime=o.mime||'application/octet-stream';
  const up=await sb.storage.from('materials').upload(path,blob,{contentType:mime});if(up.error)throw up.error;
  const x=await sb.from('files').insert({module_id:String(o.module||'')||null,name:name,storage_path:path,mime:mime,size_bytes:blob.size,title:String(o.title||name).slice(0,120),place:o.place==='theory'?'theory':'files',created_by:ME.id}).select().single();
  if(x.error){await sb.storage.from('materials').remove([path]);throw x.error}
  const f=mapF(x.data);await signFiles([f]);return{ok:true,file:f,shared:true}}
 case 'delete':{const q=await sb.from('files').select('storage_path').eq('id',o.id).single();if(q.error)throw q.error;
  await sb.storage.from('materials').remove([q.data.storage_path]);const x=await sb.from('files').delete().eq('id',o.id);if(x.error)throw x.error;return{ok:true}}
 }return{ok:false,error:'action'}}
async function api(o){try{return await sbApi(o)}catch(e){console.error(e);const m=(e&&e.message)||'';return{ok:false,error:(e&&e.code==='23505')?'dup':/rate_limit/.test(m)?'limit':'fail'}}}
let ATT=[],MYCS=[];

const ls={g(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let MODS=ls.g('sb_m',[]),TOPICS=ls.g('sb_tp',[]);

 let g=document.getElementById('burger'),mp=document.getElementById('mpanel');
 if(!g){g=document.createElement('button');g.id='burger';g.type='button';g.className='burger';g.setAttribute('aria-label','Меню');g.setAttribute('aria-expanded','false');

/* ===== ЗАГРУЖАЕМЫЕ ТЕСТЫ =====
   Редактор выбирает файл Excel (.xlsx, .xls) или CSV прямо на вкладке «Тест» — тест появляется у всех пользователей.
   Формат таблицы (первая строка — заголовки, её можно оставить):
   A «Вопрос» | B–F «Вариант 1…5» (от 2 до 5 заполненных) | G «Верный вариант» (номер: 1, 2, 3…) | H «Пояснение».
   Загруженные тесты хранятся в таблице Google через Apps Script (файл apps_script_tests.gs). */
let TESTS=ls.g('sb_t',[]),tsel={};
const MAXQ=100,TEXTS=['xlsx','xls','csv'];
function loadTests(){if(!CFG_URL)return;const was=JSON.stringify(TESTS);
  fetchTests().then(x=>{TESTS=x;ls.s('sb_t',[])}).catch(()=>{})
  .then(()=>{if(U&&!fbusy&&(view=='home'||(cur>=0&&tab=='t'))&&was!=JSON.stringify(TESTS)&&!document.querySelector('#v input:checked'))draw()})}
function csvRows(t){t=t.replace(/^\uFEFF/,'');const f=t.split(/\r?\n/)[0]||'',cnt=ch=>f.split(ch).length-1,dl=[';','\t',','].sort((a,b)=>cnt(b)-cnt(a))[0];
  const rows=[];let r=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
   if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
   else if(ch=='"')q=true;
   else if(ch==dl){r.push(c);c=''}
   else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';rows.push(r);r=[]}
   else c+=ch}
  if(c!==''||r.length){r.push(c);rows.push(r)}
  return rows}
const decodeBuf=b=>{try{return new TextDecoder('utf-8',{fatal:true}).decode(b)}catch(e){return new TextDecoder('windows-1251').decode(b)}};
const needXlsx=()=>window.XLSX?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=()=>no(new Error('xlsx'));document.head.appendChild(s)});
function readTable(f){return new Promise((ok,no)=>{const rd=new FileReader();rd.onerror=()=>no(new Error('read'));
  rd.onload=()=>{if(fext(f.name)=='csv')return ok(csvRows(decodeBuf(rd.result)));
   needXlsx().then(()=>{const wb=XLSX.read(rd.result,{type:'array'});ok(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:false}))}).catch(()=>no(new Error('xlsx')))};
  rd.readAsArrayBuffer(f)})}
/* строки таблицы → вопросы в том же формате, что и в блоке «Данные»: [вопрос, [варианты], номер_верного_с_нуля, пояснение] */
function parseTest(rows){const q=[],err=[];
  rows.forEach((r,i)=>{r=r.map(x=>x==null?'':String(x).trim());if(r.every(x=>!x))return;
   if(/^вопрос/i.test(r[0])&&!/^[\d\s,;+]+$/.test(r[6]||''))return;
   const n=i+1,o=[];for(let j=1;j<=5;j++)if(r[j])o.push([j,r[j]]);
   const ks=String(r[6]||'').split(/[\s,;+]+/).filter(Boolean).map(s=>parseInt(s,10)),ats=[...new Set(ks.map(k=>o.findIndex(x=>x[0]==k)))].sort((a,b)=>a-b),at=(ks.length&&ats.every(a=>a>=0))?(ats.length>1?ats:ats[0]):-1;
   if(!r[0])err.push('Строка '+n+': нет текста вопроса.');
   else if(o.length<2)err.push('Строка '+n+': нужно минимум два варианта ответа.');
   else if(at<0)err.push('Строка '+n+': в колонке «Верный вариант» укажите номер заполненного варианта (1–5).');
   else q.push([r[0],o.map(x=>x[1]),at,r[7]||((Array.isArray(at)?'Верные ответы: '+at.map(a=>o[a][1]).join('; '):'Верный ответ: '+o[at][1]))])});
  if(!q.length&&!err.length)err.push('В файле не найдено ни одного вопроса.');
  if(q.length>MAXQ)err.push('Слишком много вопросов: максимум '+MAXQ+'.');
  return{q,err}}
function tmplCsv(){const L=['Вопрос;Вариант 1;Вариант 2;Вариант 3;Вариант 4;Вариант 5;Верный вариант (номер; если верных несколько: 1,3);Пояснение',
  'Что отличает руководителя от специалиста?;Больше личной экспертизы;Результат достигается через других людей;Меньше ответственности;;;2;Руководитель отвечает за результат команды.',
  'Какой стиль подходит новичку?;Либеральный;Директивный;Отказ от управления;;;2;Неопытному сотруднику нужны чёткие указания.',
  'Что входит в обязанности руководителя? (несколько верных);Планирование;Обучение команды;Личная уборка помещений;Постановка задач;;1,2,4;Руководитель планирует, обучает и ставит задачи.'];
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+L.join('\r\n')],{type:'text/csv;charset=utf-8'}));a.download='шаблон_теста.csv';document.body.appendChild(a);a.click();a.remove()}
/* форма редактора на вкладке «Тест»: список загруженных тестов + загрузка нового */

   if(f.size>2*1048576){say('Файл слишком большой для теста.');return}
   fbusy=true;tu.disabled=true;say('Читаю файл…');
   readTable(f).then(rows=>{const p=parseTest(rows);
    if(p.err.length){fbusy=false;tu.disabled=false;say(p.err.slice(0,5).join(' ')+(p.err.length>5?' …и ещё ошибок: '+(p.err.length-5):''));return}
    say('Загрузка… не закрывайте страницу.');
    return api({action:'test_save',pin:PIN,module:c,title:t||f.name.replace(/\.[^.]+$/,''),q:p.q,by:U.name}).then(j=>{fbusy=false;
     if(j.ok){TESTS.push(j.test);ls.s('sb_t',TESTS);tsel[c]=String(j.test.id);draw()}
     else{tu.disabled=false;if(j.error=='pin'){setPin('');alert('Код редактора больше не подходит. Войдите заново.');draw()}else say(j.error=='size'?'Тест слишком большой.':'Ошибка загрузки.')}})})
   .catch(e=>{fbusy=false;tu.disabled=false;say(e&&e.message=='xlsx'?'Не удалось открыть Excel-файл. Сохраните таблицу как CSV и загрузите снова.':e&&e.message=='read'?'Не удалось прочитать файл.':'Нет связи с сервером. Проверьте интернет и что опубликована новая версия скрипта.')})}}
/* вкладка ТЕСТ: основной тест из блока «Данные» + загруженные со страницы; кнопка «Проверить знания», подсчёт и результат (блок .res) */
let TR=null,TC=null,TMR=null;
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const mmss=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const stopTimer=()=>{if(TMR){clearInterval(TMR);TMR=null}};
function newRun(T){stopTimer();const idx=T.q.map((_,i)=>i),order=(T.sq?shuf(idx):idx).map(qi=>({qi:qi,opts:T.q[qi][1].map((_,j)=>j)}));
 if(T.so)order.forEach(o=>{o.opts=shuf(o.opts)});
 return{id:T.id,order:order,ans:{},cur:0,started:!T.tm,mode:ls.g('sb_tmode','one'),done:false,res:null,deadline:0,low:false,sending:false}}
const tHas=o=>{const a=TR.ans[TC.T.q[o.qi][4]];return Array.isArray(a)?a.length>0:a!=null};

const tErr=e=>{const m=(e&&e.message)||'';for(const k in TERR)if(m.indexOf(k)>=0)return TERR[k];return'Не удалось выполнить действие. Проверьте связь и попробуйте ещё раз.'};
function tFox(ans,n){if(TR.low)return['look','Осталась минута: проверьте ответы и отправляйте.'];
 if(ans>=n)return['cool','Все вопросы отвечены. Можно проверять!'];if(ans==0)return['hello','Удачи! Читайте вопросы внимательно.'];

function tQ(pos){const R=TR,o=R.order[pos],q=TC.T.q[o.qi],multi=!!q[5],a=R.ans[q[4]],sel=Array.isArray(a)?a:(a==null?[]:[a]);

  +o.opts.map(j=>'<label><input type="'+(multi?'checkbox':'radio')+'" name="q'+pos+'" value="'+j+'"'+(sel.includes(j)?' checked':'')+'> '+esc(q[1][j])+'</label>').join('')+'</div>'}
function testTab(d,v){const c=code(d),list=TESTS.filter(t=>String(t.module)==c&&Array.isArray(t.q)&&t.q.length);

function tPaint(){const bx=document.getElementById('tbox');if(!bx||!TR||!TC)return;const R=TR,T=TC.T;
 if(R.done){bx.innerHTML=tResultHtml();return}
 if(!R.started){bx.innerHTML=tinfo(T)+'<div class="cst"><img src="fox/start.webp" alt="" width="84"><div><b>Тест с ограничением времени</b><br><span class="ex">Вопросов: '+T.q.length+'. Время: '+T.tm+' мин. Таймер запустится после нажатия «Начать». Когда время закончится, ответы отправятся автоматически.</span></div></div><div class="fmsg" id="tmsg" role="status"></div><button class="btn" id="tgo" type="button">Начать тест</button>';return}
 const n=R.order.length,ans=R.order.filter(tHas).length,one=R.mode=='one',fp=tFox(ans,n),left=Math.max(0,Math.round((R.deadline-Date.now())/1000));

  +'<div class="tfox"><img src="fox/'+fp[0]+'.webp" alt=""><p id="tfp">'+fp[1]+'</p></div>'
  +(one?'<div class="qdots" role="group" aria-label="Вопросы">'+R.order.map((o,i)=>'<button type="button" data-qd="'+i+'" class="'+(tHas(o)?'a ':'')+(i==R.cur?'c':'')+'" aria-label="Вопрос '+(i+1)+'">'+(i+1)+'</button>').join('')+'</div>':'')

function tUpdate(){const R=TR;if(!R||R.done||!R.started)return;const n=R.order.length,ans=R.order.filter(tHas).length,fp=tFox(ans,n),q=s=>document.querySelector('#tbox '+s);

 const ct=q('#tcnt');if(ct)ct.textContent='Отвечено '+ans+' из '+n;const fi=q('.tfox img');if(fi)fi.src='fox/'+fp[0]+'.webp';const ft=q('#tfp');if(ft)ft.textContent=fp[1];

function onTChange(ev){const el=ev.target,box=el.closest&&el.closest('[data-p]');if(!box||!TR||TR.done)return;

 if(el.type=='checkbox'){const arr=[...box.querySelectorAll('input:checked')].map(x=>+x.value).sort((a,b)=>a-b);if(arr.length)R.ans[id]=arr;else delete R.ans[id]}

function onTClick(ev){const R=TR;if(!R)return;const g=s=>ev.target.closest(s);let b;
 if(b=g('#tgo')){const T=TC.T,ms=document.getElementById('tmsg');b.disabled=true;ms.textContent='Запускаю…';
  sb.rpc('start_test',{p_test_id:T.id}).then(r=>{if(r.error){b.disabled=false;ms.textContent=tErr(r.error);return}
   R.started=true;R.low=false;R.deadline=Date.now()+(+(r.data&&r.data.seconds)||T.tm*60)*1000;stopTimer();TMR=setInterval(tTick,500);tPaint()});return}

function tTick(){const R=TR;if(!R||R.done||!R.started){stopTimer();return}const s=Math.max(0,Math.round((R.deadline-Date.now())/1000)),el=document.getElementById('ttm');
 if(el){el.textContent=mmss(s);el.classList.toggle('low',s<=60)}

function tSubmit(auto){const R=TR,T=TC.T,d=TC.d;if(!R||R.done||R.sending)return;
 const miss=R.order.map((o,i)=>[o,i]).filter(x=>!tHas(x[0])),ms=()=>document.getElementById('tmsg');
 if(!auto&&miss.length){if(R.mode=='one'){R.cur=miss[0][1];tPaint()}const m_=ms();if(m_)m_.textContent='Ответьте на все вопросы: не отвечено '+miss.length+'.';return}
 R.sending=true;stopTimer();const sd=document.getElementById('tsend');if(sd)sd.disabled=true;const m0=ms();if(m0)m0.textContent=auto?'Время вышло, отправляю ответы…':'Проверяю…';

  if(error||!data){const e=tErr(error);if(/time_over/.test((error&&error.message)||'')){TR=newRun(T);tPaint();const m_=ms();if(m_)m_.textContent=e;return}

   В таблицу текст сохраняется в этом виде, на странице превращается в безопасный HTML. */
const h2m=h=>String(h||'').replace(/<br\s*\/?>/gi,'\n').replace(/<\/?(b|strong)>/gi,'**').replace(/<\/?(i|em)>/gi,'__').replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&');

/* [img:ID] в тексте раздела = картинка с Диска (маркер ставит кнопка «Добавить картинку») */
const m2h=t=>{const im=[];let h=esc(t).replace(/\r?\n?\[img:([\w-]+)\]\r?\n?/g,(_,id)=>{im.push(id);return '\u0001'+(im.length-1)+'\u0001'});
  h=h.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/__(.+?)__/g,'<i>$1</i>').replace(/\r?\n/g,'<br>');
  return h.replace(/\u0001(\d+)\u0001/g,(_,i)=>'<img class="timg" src="'+thumb(im[+i],1200)+'" data-full="'+thumb(im[+i],2000)+'" alt="Иллюстрация" loading="lazy">')};

/* ===== КАРТИНКИ В РАЗДЕЛАХ: выбранный файл уменьшается до 1600 px, сохраняется как JPG и грузится на Диск (как обычный файл, но с именем img_…) ===== */
function shrinkImage(f,max){return new Promise((ok,no)=>{const u=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{URL.revokeObjectURL(u);let w=im.naturalWidth,h=im.naturalHeight;if(!w||!h)return no(new Error('img'));const k=Math.min(1,max/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
   const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);ok(c.toDataURL('image/jpeg',0.85).split(',')[1])};
  im.onerror=()=>{URL.revokeObjectURL(u);no(new Error('img'))};im.src=u})}
function uploadImage(f,c){return shrinkImage(f,1600).then(data=>api({action:'upload',pin:PIN,place:'files',module:c,title:'Картинка',name:'img_'+Date.now().toString(36)+'.jpg',mime:'image/jpeg',data:data,by:U.name}))
  .then(j=>{if(!j.ok){const e=new Error(j.error||'x');e.code=j.error;throw e}if(j.shared===false)alert('Картинка загружена, но Google запретил общий доступ по ссылке. Другие пользователи её не увидят: проверьте настройки доступа Диска.');return j.file.fileId})}
