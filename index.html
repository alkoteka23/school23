<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><!--
=====================================================================
 КАК УСТРОЕН ФАЙЛ (4 блока, сверху вниз)
 1) СТИЛИ (между тегами style)  — оформление. Цвета заданы переменными в начале (--ac = основной цвет).
 2) ЗАГОЛОВОК (тег header)      — название страницы. Кнопки модулей создаются автоматически.
 3) СКРИПТ, БЛОК «ДАННЫЕ»       — ВЕСЬ КОНТЕНТ: теория, тесты, кейсы.
    >>> Редактировать нужно ТОЛЬКО его. Инструкция — внутри блока. <<<
 4) СКРИПТ, БЛОК «ДВИЖОК»       — код, который рисует страницу и считает результат.
    Без необходимости не трогать.
=====================================================================
-->
<title>Школа руководителя: теория, тесты, кейсы</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=PT+Serif:wght@700&display=swap">
<style>
/* ===== 1. ОФОРМЛЕНИЕ =====
   Цвета:
 --bg фон страницы,
 --sf фон карточек,
 --tx текст,
 --mu серый текст,
 --ac основной цвет (кнопки, акценты), 
 --ok/--okb верный ответ, 
 --no/--nob неверный.
   Тёмная тема продублирована ниже (media и data-theme=dark): меняйте цвета в обоих местах. */
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#FAF5EE;
--sf:#FFFFFF;
--tx:#4E0F1A;
--mu:#3B0A12;
--ac:#4E0F1A;
--ok:#cee1df;
--okb:#cee1df;
--no:#f4cccc;
--nob:#f4cccc;
--bd:#d5dedc}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#FAF5EE;--sf:#FFFFFF;--tx:#4E0F1A;--mu:#3B0A12;--ac:#4E0F1A;--ok:#cee1df;--okb:#cee1df;--no:#f4cccc;--nob:#f4cccc;--bd:#2c3a3d}}
:root[data-theme=dark]{--bg:#121a1c;--sf:#FFFFFF;--tx:#4E0F1A;--mu:#3B0A12;--ac:#4E0F1A;--ok:#cee1df;--okb:#cee1df;--no:#ff8a80;--nob:#3b1f1d;--bd:#2c3a3d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 "PT Sans",system-ui,sans-serif}
/* верхнее меню: ОДНА строка — логотип | разделы | пользователь.
   Высота меню задаётся min-height и padding в .top-inner; ширина содержимого — max-width. */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:#4E0F1A;border-bottom:1px solid #4E0F1A}
.top-inner{max-width:860px;margin:auto;padding:6px 16px;min-height:56px;display:flex;flex-wrap:nowrap;align-items:center;gap:8px}
.top img{order:1;width:112px;height:auto;flex:none;object-fit:contain}
.brand{font:700 20px/1 "PT Serif",Georgia,serif;color:#FFFFFF;letter-spacing:.02em}
/* заглавный блок: крупный заголовок и картинка рядом */

h1{font:700 clamp(34px,7vw,60px)/1.1 "PT Serif",Georgia,serif;margin:0;color: #ffffff;}
nav{display:flex;gap:6px;overflow-x:auto;padding:12px 16px;max-width:860px;margin:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}nav::-webkit-scrollbar{display:none}
main{max-width:860px;margin:auto;padding:0 16px 40px}
h2{font:700 21px/1.25 "PT Serif",Georgia,serif;margin:8px 0 12px}
.tabs{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
details{background:var(--sf);border:1px solid var(--bd);border-radius:8px;margin-bottom:8px;padding:10px 14px}
summary{font-weight:700;cursor:pointer}details p{margin:8px 0 2px}
.q{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:14px;margin-bottom:12px}
.q b{display:block;margin-bottom:8px}
label{display:block;padding:7px 10px;border:1px solid var(--bd);border-radius:6px;margin-bottom:6px;cursor:pointer}
label.ok{background:var(--okb);border-color:var(--ok)}label.no{background:var(--nob);border-color:var(--no)}
.ex{font-size:14px;color:var(--mu);margin-top:6px}
.res{background:var(--sf);border:2px solid var(--ac);border-radius:10px;padding:16px;margin:14px 0;font-size:18px}
.res strong{font:700 30px "PT Serif",serif;color:var(--ac)}
.sit{background:var(--sf);border-left:4px solid var(--ac);padding:12px 14px;border-radius:0 8px 8px 0;margin-bottom:12px}
/* слайды: листаются свайпом, стрелками на экране или клавишами ← → */
.sl{position:relative;margin:10px 0 4px}
.st{display:flex;align-items:center;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;border:1px solid var(--bd);border-radius:8px;background:#fff}
.st::-webkit-scrollbar{display:none}
.st img{flex:none;width:100%;height:auto;display:block;scroll-snap-align:center;scroll-snap-stop:always}
.sl .pv,.sl .nx{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;border-radius:50%;background:var(--ac);color:var(--sf);font:700 24px/1 "PT Sans";cursor:pointer;opacity:.85;padding:0}
.sl .pv{left:8px}.sl .nx{right:8px}
.sl .pv:disabled,.sl .nx:disabled{opacity:.25;cursor:default}
.sl .cn{position:absolute;right:10px;bottom:10px;background:var(--ac);color:var(--sf);font-size:13px;padding:2px 10px;border-radius:12px}
.fm input{display:block;width:100%;padding:10px;margin:0 0 10px;border:1px solid var(--bd);border-radius:6px;font:inherit;color:var(--tx);background:var(--sf)}
/* ===== Блок пользователя в верхнем меню: аватар + имя + кнопка «Сменить» ===== */
.user{order:3;margin-left:auto;flex:none;display:flex;align-items:center;gap:8px;min-width:0;
  padding:3px 4px 3px 3px;border-radius:999px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22)}
.user[hidden]{display:none}
.ava{flex:none;width:32px;height:32px;border-radius:50%;background:#FAF5EE;color:#4E0F1A;
  display:grid;place-items:center;font:700 13px/1 "PT Sans",sans-serif;letter-spacing:.02em}
.uinfo{display:flex;flex-direction:column;min-width:0;line-height:1.2}
.uname{color:#fff;font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:92px}
.ushop{color:rgba(255,255,255,.72);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:92px}
.swap svg{width:14px;height:14px;flex:none}

/* ===== Разделы верхнего меню: Продавцам / Администратору / Супервайзеру ===== */
.roles{order:2;flex:1 1 auto;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:0;padding:2px 0}
.roles::-webkit-scrollbar{display:none}
.roles[hidden]{display:none}

/* ===== ЕДИНЫЙ СТИЛЬ КНОПОК (как в верхнем меню) =====
   Все кнопки страницы: «таблетка», жирный шрифт, одинаковая высота.
   Обычная = контур, активная / главная = залитая.
   Размеры и цвета меняются только здесь. */
.btn,.fbtn,nav button,.tabs button,.chips button,.swap,.roles button{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:none;
  min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--ac);
  background:transparent;color:var(--ac);font:700 15px/1 "PT Sans",sans-serif;
  text-decoration:none;cursor:pointer;transition:background .15s,color .15s,transform .1s}
.btn:active,.fbtn:active,nav button:active,.tabs button:active,.chips button:active,.swap:active,.roles button:active{transform:scale(.97)}
.btn:disabled,.fbtn:disabled{opacity:.5;cursor:default}
/* контурные: подсветка при наведении */
nav button:hover,.tabs button:hover,.chips button:hover,.fbtn.alt:hover{background:rgba(78,15,26,.08)}
/* залитые: главная кнопка и выбранный пункт */
.btn,.fbtn,nav button[aria-current=true],.tabs button[aria-selected=true],.chips button[aria-pressed=true]{background:var(--ac);color:var(--sf)}
.btn:hover,.fbtn:hover,nav button[aria-current=true]:hover,.tabs button[aria-selected=true]:hover,.chips button[aria-pressed=true]:hover{background:#6a1a28}
.fbtn.alt{background:transparent;color:var(--ac)}
.fbtn.del{background:transparent;color:#B3261E;border-color:#B3261E}.fbtn.del:hover{background:rgba(179,38,30,.08)}
/* кнопки внутри верхнего меню (на тёмном фоне) */
.roles button{min-height:40px;padding:0 13px;font-size:14px;border-color:rgba(255,255,255,.28);color:#fff}
.roles button:hover{background:rgba(255,255,255,.14)}
.roles button[aria-current=true]{background:#FAF5EE;color:#4E0F1A;border-color:#FAF5EE}
.swap{min-height:32px;padding:0 12px;border:0;background:#FAF5EE;color:#4E0F1A;font-size:13px}
.swap:hover{background:#fff}
.swap:focus-visible,.roles button:focus-visible{outline:3px solid #fff;outline-offset:2px}
/* выбор теста (основной / загруженные) */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
/* кнопка «Выберите файл» в формах — в том же стиле */
input[type=file]::file-selector-button{margin-right:12px;padding:9px 16px;border:1px solid var(--ac);border-radius:999px;background:transparent;color:var(--ac);font:700 14px/1 "PT Sans",sans-serif;cursor:pointer}
input[type=file]::file-selector-button:hover{background:rgba(78,15,26,.08)}
/* ===== Вкладка «Материалы»: карточки файлов ===== */
.fc{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px}
.fi{flex:none;width:46px;height:52px;border-radius:8px;display:grid;place-items:center;color:#fff;font:700 12px/1 "PT Sans",sans-serif;letter-spacing:.03em}
.t-ppt{background:#C4492B}.t-pdf{background:#B3261E}.t-doc{background:#2B5CC4}.t-xls{background:#1E7A46}.t-img{background:#6B6B6B}
.fb{flex:1 1 180px;min-width:0}.fb b{display:block;overflow-wrap:anywhere}.fb .ex{margin:2px 0 0;overflow-wrap:anywhere}
.fa{display:flex;gap:8px;flex-wrap:wrap}
.edbar a,.ex a{color:var(--ac);font-weight:700}
.emb{position:relative;width:100%;border:1px solid var(--bd);border-radius:8px;overflow:hidden;background:#fff;margin-top:8px}
.emb.w{aspect-ratio:16/9;min-height:220px}.emb.t{height:min(75vh,640px)}
.emb iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.emb-img{display:block;width:100%;height:auto;border-radius:8px;margin-top:8px}
.fmsg{min-height:20px;font-size:14px;margin:0 0 8px;color:var(--mu)}
.edbar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
@media(max-width:760px){.fa{width:100%}.fa .fbtn{flex:1}}
.empty{background:var(--sf);border:1px dashed var(--bd);border-radius:10px;padding:22px 16px;text-align:center;color:var(--mu);margin-top:8px}

:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
header.hero {
  position: relative;
  isolation: isolate;
  width: 100%;
max-width: none;
box-sizing: border-box;
  height: 300px;
  margin: 0px auto;
  padding: 28px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  background: none;
}

header.hero::before {
  content: "";
  position: absolute;
  z-index: -1;
 inset: 0;
  background: url("images/fon.png") center / cover no-repeat;
  border-radius: 0px;
}

header.hero h1,
header.hero img {
  position: relative;
left: 200px; /* сдвинуть вправо */
}

header.hero img {
  display: block;
  width: 209px;
  height: auto;
  flex: none;
  border-radius: 12px;
  transform: translateX(-450px);
}

/* ===== ТЕЛЕФОН / ПЛАНШЕТ: на узких экранах сдвиги убираем, всё выстраивается в одну строку ===== */
@media (max-width: 760px) {
  header.hero {
    height: auto;
    min-height: 190px;
    padding: 22px 16px;
    gap: 12px;
    justify-content: space-between;
  }

  header.hero::before { inset: 0; }

  header.hero h1,
  header.hero img {
    left: 0;
    transform: none;
  }

  header.hero h1 {
    font-size: clamp(26px, 8vw, 40px);
    min-width: 0;
    overflow-wrap: anywhere;
  }

  header.hero img {
    width: 36%;
    max-width: 150px;
  }

  main { padding: 0 12px 32px; }
  nav { padding: 10px 12px; }
  .tabs button { white-space: nowrap; }
  label { padding: 11px 12px; }
  .btn { width: 100%; min-height: 46px; }
  .res strong { font-size: 26px; }
  .sl .pv, .sl .nx { width: 36px; height: 36px; }
}

/* телефон: меню остаётся в одну строку — у пользователя остаётся только аватар и значок «Сменить» */
@media (max-width: 820px) {
  .uinfo, .swap span { display: none; }
  .swap { padding: 0 10px; }
}

@media (max-width: 520px) {
  .top-inner { padding: 6px 12px; gap: 8px; }
  .top img { width: 84px; }
  .roles button { font-size: 14px; padding: 0 14px; }
  .top { position: static; }
}


</style></head><body>
<!-- ===== 2. ВЕРХНЕЕ МЕНЮ И ЗАГОЛОВОК =====
 Логотип: замените блок <svg> на <img src="logo.png" alt="Логотип"> (или вставьте свой SVG).
 Картинка справа от заголовка: замените <svg class="hero"> на <img class="hero" src="picture.jpg" alt="">. -->
<div class="top">
  <div class="top-inner">
    <img src="images/Aa.png" alt="">
    <div class="user" id="user" hidden></div>
    <div class="roles" id="roles" role="tablist" aria-label="Разделы" hidden></div>
  </div>
</div><header class="hero">
  <h1>Школа <br>руководителя</h1>
  <img src="56.png" alt="">
</header>
<nav id="nav" aria-label="Модули"></nav><main id="m"></main>

<script>
/* =====================================================================
   3. ДАННЫЕ — ВСЁ СОДЕРЖАНИЕ ТРЕНАЖЁРА
   =====================================================================
   Структура: D = список модулей. Каждый модуль состоит из трёх частей:

   n  : название модуля (показывается в заголовке)
   th : ТЕОРИЯ — список тем в формате  ["Название темы", "Текст темы"],
        СЛАЙДЫ / КАРТИНКИ (необязательно): третьим элементом добавьте список картинок —
        ["Название темы", "Текст темы", ["slide1.jpg","slide2.jpg","slide3.jpg"]],
        они покажутся под текстом и будут листаться свайпом, стрелками или клавишами ← →.
        Если нужны только слайды без текста — оставьте текст пустым: ["Название темы", "", ["slide1.jpg","slide2.jpg"]].
        Одна картинка тоже подойдёт: ["slide1.jpg"].
        Как получить слайды: в PowerPoint «Файл → Экспорт → Изменить тип файла → JPEG/PNG → Все слайды»,
        положите файлы рядом с этой страницей и укажите имена (например "slides/1.jpg").
   q  : ТЕСТ   — список вопросов в формате
        ["Вопрос", ["вариант 0","вариант 1","вариант 2"], НОМЕР_ВЕРНОГО, "Пояснение"],
        НОМЕР_ВЕРНОГО считается с нуля: первый вариант = 0, второй = 1, третий = 2.
         ТЕСТЫ МОЖНО И НЕ ПИСАТЬ В КОДЕ: вкладка «Тест» → «Режим редактора» → загрузить таблицу Excel/CSV
         (понадобится apps_script_tests.gs, см. инструкцию в этом файле).
   k  : КЕЙС   — ["Описание ситуации", [
          ["Вариант решения", 0, "Разбор: почему не лучший"],
          ["Вариант решения", 1, "Разбор: почему верный"],   // 1 = верный, 0 = неверный
        ]]

   ПРАВИЛА (иначе страница перестанет работать):
   • Каждый элемент заканчивается запятой, кроме последнего в списке.
   • Внутри текста НЕ используйте прямые кавычки " — вместо них пишите «ёлочки».
   • В тексте теории можно использовать теги: <b>жирный</b>, <i>курсив</i>, <br> (перенос строки).
   • В кейсе должен быть ровно один верный вариант (с цифрой 1).

   КАК ДОБАВИТЬ:
   • тему теории   — скопируйте любую строку ["Название","Текст"], внутри th:[ ... ]
   • вопрос теста  — скопируйте любую строку вопроса, внутри q:[ ... ]
   • новый модуль  — скопируйте весь блок от { до }, и вставьте после запятой в конце предыдущего
   ===================================================================== */
/* ╔═══ РАЗДЕЛЫ ВЕРХНЕГО МЕНЮ ═══╗
   Для каждого раздела перечислены номера модулей, которые в нём показываются.
   Чтобы перенести модуль в другой раздел — поменяйте номер в нужном списке.
   Пустой список [] = раздел в разработке (покажется заглушка). */
const ROLES=[
 {id:'seller',t:'Продавцам',mods:[]},
 {id:'admin',t:'Администратору',mods:['2.1','2.2','2.3','2.4']},
 {id:'sup',t:'Супервайзеру',mods:['1.1','1.2','1.3','1.4','1.5','1.6','1.7']}
];

const D=[

/* ╔═══ МОДУЛЬ 1.1 ═══╗ */
{n:"1.1 Основы управления",
/* --- ТЕОРИЯ модуля 1.1 --- */
th:[
["Управленческая позиция","Кто такой руководитель? ",["slides/2.jpg"]],
["Стили управления", "",["slides/3.jpg"]],
["Роли руководителя (по Минцбергу)","Межличностные (лидер, связующее звено), информационные (получатель, распространитель, представитель), решенческие (предприниматель, устраняющий нарушения, распределитель ресурсов, переговорщик)."],
["Управленческие и неуправленческие дела","Управленческие: планирование, постановка задач, делегирование, обратная связь, контроль, развитие людей. Неуправленческие: личное выполнение операционных задач за подчинённых. Анализ по хронометражу недели показывает, на что уходит время, и помогает увеличить долю управленческих дел.<br><b>Как провести анализ:</b> 1) неделю фиксируйте дела блоками по 30 минут; 2) разметьте: управленческое / неуправленческое; 3) для каждого неуправленческого дела выберите: делегировать, автоматизировать, исключить; 4) заложите в календарь постоянные блоки на планирование, 1-на-1 и контроль. Ориентир: у линейного руководителя 40–60% времени на управленческие дела."],
["Преобладающая функция менеджмента","Четыре функции: планирование, организация, мотивация, контроль. Перекос в одну функцию (например, только контроль) показывает слепые зоны руководителя и зону развития.<br><b>Пример:</b> руководитель много контролирует и мало планирует: команда работает в режиме «тушения пожаров». Решение: ввести недельное планирование и зафиксировать долю времени на каждую функцию."]],
/* --- ТЕСТ модуля 1.1 --- */

{n:"1.2 Планирование",
/* --- ТЕОРИЯ модуля 1.2 --- */
th:[
["Виды и принципы планирования","Стратегическое (годы), тактическое (год), оперативное (недели). Принципы: целесообразность, реалистичность, измеримость, гибкость, непрерывность."],
["Пирамида планирования","Миссия → видение → стратегические цели → тактика → задачи. Каждая задача должна быть связана с верхним уровнем.<br><b>Пример:</b> миссия: безопасная логистика; цель года: доставка в срок 98%; тактика: перестроить маршруты; задача недели: согласовать график с тремя перевозчиками. <b>Проверка:</b> вверх спрашиваем «ради чего?», вниз «как?»; задача без ответа лишняя."],
["Диаграмма Исикавы","«Рыбья кость»: поиск причин проблемы по категориям (люди, методы, материалы, оборудование, среда, измерения).<br><b>Шаги:</b> 1) формулируем проблему в «голове рыбы»; 2) рисуем «кости» по категориям; 3) командой записываем возможные причины; 4) отмечаем наиболее вероятные и проверяем фактами; 5) назначаем меры по главным причинам."],
["Дорожная карта","Визуальный план этапов, сроков, результатов и ответственных на пути к цели.<br><b>Структура:</b> цель и результат; этапы с датами; ответственные; ресурсы; контрольные точки (вехи); риски. <b>Правила:</b> 5–7 этапов на листе, веха = проверяемый результат, пересмотр раз в месяц. Карта показывает путь и приоритеты, а не каждую операцию."],
["Метод «5 почему»","Пять раз подряд задаём вопрос «почему?», чтобы дойти от симптома до корневой причины.<br><b>Пример:</b> клиент получил заказ поздно → почему? склад отгрузил позже → почему? заказ пришёл в 17:30 → почему? менеджер вводит заказы пачкой вечером → почему? нет правила немедленного ввода. Корень: нет регламента; мера: ввод в течение 30 минут. Ищем причины в процессе, а не в человеке; останавливаемся, когда причину можно устранить."],
["Дерево целей","Главная цель раскладывается на подцели и задачи по уровням, показывая зависимости.<br><b>Построение:</b> главная цель → 2–5 подцелей → задачи; подцели вместе дают цель и не пересекаются. <b>Пример:</b> рост выручки на 15% → расширить базу клиентов (новые каналы) / повысить средний чек (допродажи) / удержать клиентов (сервис). Используется для распределения ответственности и KPI."],
["Матрица Эйзенхауэра","Срочно и важно: делать сразу. Важно, не срочно: планировать. Срочно, не важно: делегировать. Не важно, не срочно: исключить.<br><b>Примеры:</b> I (срочно+важно): авария на производстве, дедлайн сегодня; II (важно, не срочно): обучение команды, планирование, стратегия; III (срочно, не важно): большинство звонков и входящих запросов; IV: бесцельный просмотр почты и чатов. Цель: проводить максимум времени в квадранте II, тогда квадрант I сокращается."],
["Правило 50/25/25","50% времени отводим на запланированное, 25% на незапланированное и внезапное, 25% на резерв и творческие/развивающие задачи.<br><b>Применение:</b> на 8-часовой день: 4 часа на плановые задачи, 2 часа на внезапные запросы, 2 часа на резерв и развитие. Если планировать 100% времени, любое отклонение ломает график. Приоритеты в плановой части расставляем по Эйзенхауэру; пропорцию корректируем по реальной доле незапланированного."],
["SMART","Цель конкретная, измеримая, достижимая, значимая, ограничена по времени.<br><b>Расшифровка:</b> Specific, Measurable, Achievable, Relevant, Time-bound.<br><b>Плохо:</b> «улучшить сервис». <b>Хорошо:</b> «снизить среднее время ответа клиенту с 4 до 2 часов к 31 марта за счёт шаблонов ответов и перераспределения смен». Проверка: можно ли в срок однозначно сказать, достигнута цель или нет."],
["SNW и SWOT","SNW: сильные, нейтральные, слабые стороны (оценка ресурсов). SWOT: сильные и слабые стороны, возможности и угрозы; помогает выбрать решение.<br><b>Как использовать:</b> заполните 4 квадранта, затем составьте пары: S+O (использовать силы для возможностей), W+O (закрыть слабости, чтобы взять возможности), S+T (силами нейтрализовать угрозы), W+T (минимизировать потери). Для каждого сочетания сформулируйте действие, ответственного и срок."],
["Анализ рисков решения","Для каждого риска: вероятность × влияние, затем меры предупреждения и план Б.<br><b>Шаги:</b> 1) выписать риски решения; 2) оценить вероятность и влияние (1–5); 3) приоритет = вероятность × влияние; 4) для рисков выше порога назначить стратегию: избежать, снизить, передать, принять; 5) назначить ответственного и сигнал, по которому включается план Б."],
["Аналитика и решения","Показатели (KPI, динамика, план/факт) → выводы → варианты решения → выбор по критериям → контроль результата."]],
/* --- ТЕСТ модуля 1.2 --- */

{n:"1.3 Организация",
/* --- ТЕОРИЯ модуля 1.3 --- */
th:[
["Матрица RACI","R (Responsible) исполняет, A (Accountable) отвечает и принимает результат (один на задачу), C (Consulted) консультирует, I (Informed) информируется.<br><b>Пример (запуск акции):</b> маркетолог: R за материалы; директор по маркетингу: A; юрист: C по условиям акции; отдел продаж: I. <b>Правила:</b> на задачу один A; роль R может быть у нескольких; C даёт совет, но не решает; лишних I не добавляем, чтобы не создавать информационный шум. Типичные ошибки: нет A или два A; все в роли C."],
["Регламентирующие документы","Правило: короткая норма поведения. Регламент: порядок действий и сроки. Положение: статус подразделения/процесса. Инструкция: пошаговое исполнение. Бизнес-процесс (БП): последовательность действий, дающая результат. Циклограмма: график повторяющихся действий во времени.<br><b>Различия:</b> Правило: коротко и без исключений (ответ клиенту в течение 2 часов). Регламент: кто, что и в какие сроки делает в процессе. Положение: цели, функции, права и ответственность отдела. Инструкция: шаги исполнителя по операции. БП: вход → действия → выход → владелец процесса. Циклограмма: например, 9:00 планёрка, 11:00 обзвон, 17:00 отчёт."],
["5S","Сортировка, соблюдение порядка, содержание в чистоте, стандартизация, совершенствование (дисциплина). Снижает потери времени и ошибки.<br><b>Пять шагов:</b> 1) сортировка: убрать лишнее (красные ярлыки); 2) порядок: у каждой вещи своё место и подпись; 3) чистота: уборка как проверка состояния; 4) стандартизация: чек-листы и фото-стандарты; 5) совершенствование: аудиты и привычка. Применимо и к цифровому порядку: папки, названия файлов, шаблоны."],
["Делегирование","Передача задачи с полномочиями и ответственностью за результат. Правила: выбрать задачу и человека, объяснить цель и критерии, дать ресурсы и полномочия, договориться о контрольных точках, не отбирать задачу назад.<br><b>Что делегировать:</b> повторяющиеся, подготовительные, развивающие задачи. <b>Что не делегировать:</b> оценку, мотивацию и дисциплинарные решения, стратегические вопросы, конфиденциальные кадровые задачи. <b>Ошибки:</b> «делегирование» без полномочий, постоянный перехват задачи, контроль каждого шага, отсутствие признания результата. <b>Уровни свободы:</b> от «сделай и согласуй» до «сделай и просто сообщи о результате»."],
["Постановка задач","Инструменты: SMART, чек-лист, формула «что, зачем, когда, критерий результата». Правила: убедиться, что задача понята (просить пересказать), зафиксировать письменно.<br><b>Шаблон:</b> Что сделать (результат) / Зачем (смысл) / Критерий готовности / Срок / Ресурсы и полномочия / Контрольные точки. <b>Пример:</b> «Подготовь сравнение трёх поставщиков по цене и срокам поставки (таблица на 1 странице), чтобы мы выбрали до пятницы. Покажи черновик в среду»."]],
/* --- ТЕСТ модуля 1.3 --- */
q:[["Сколько ролей A (Accountable) должно быть на одну задачу в RACI?",["Ни одной","Одна","Столько, сколько исполнителей"],1,"За итог отвечает один человек, иначе ответственность размывается."],
["Что является обязательным при делегировании?",["Передать полномочия вместе с ответственностью","Проверять каждый шаг","Забрать задачу при первой ошибке"],0,"Без полномочий делегирование превращается в перекладывание."],
["Первая S в системе 5S означает...",["Стандартизацию","Сортировку","Совершенствование"],1,"Seiri: убрать лишнее."]],

/* ╔═══ МОДУЛЬ 1.4 ═══╗ */
{n:"1.4 Мотивация",
/* --- ТЕОРИЯ модуля 1.4 --- */
th:[
["Виды и факторы","Внутренняя (интерес, смысл, развитие) и внешняя (деньги, статус, условия). Материальная и нематериальная. Факторы: оплата, признание, содержание работы, рост, культура, руководитель.<br><b>Мотив и стимул:</b> стимул: внешнее воздействие, мотив: внутренняя причина. Нематериальные стимулы: признание, обучение, гибкий график, интересные задачи. Мотивы у людей разные, поэтому первый шаг: спросить «что для вас ценно в работе?»."],
["Содержательные теории","Маслоу: пирамида потребностей (физиология, безопасность, принадлежность, признание, самореализация). Макклелланд: потребности достижения, власти, причастности. Герцберг: гигиенические факторы (не мотивируют, но их отсутствие демотивирует) и мотиваторы (достижение, признание, содержание работы).<br><b>Применение:</b> Маслоу: выясните, какая потребность не закрыта у сотрудника (например, безопасность при угрозе сокращений). Макклелланд: «достижение» дайте сложные задачи с обратной связью; «власть» дайте руководство проектом; «причастность» дайте командную работу. Герцберг: сначала уберите «гигиенические» раздражители (график, оплата, оборудование), затем усиливайте мотиваторы."],
["Процессуальные теории","Врум (ожидания): мотивация = ожидание, что усилия дадут результат × что результат даст вознаграждение × ценность вознаграждения. Адамс (справедливость): человек сравнивает свой вклад и награду с вкладом и наградой других.<br><b>Врум:</b> мотивация падает, если хотя бы одно звено цепочки «усилия → результат → награда» обнулено (человек не верит, что справится; результат не замечают; награда не интересна). <b>Адамс:</b> при ощущении несправедливости человек снижает усилия, просит повышения или уходит. Руководителю важно прозрачно объяснять критерии оценки и вознаграждения."],
["Обратная связь: виды, цели, правила","Поддерживающая (закрепить хорошее) и корректирующая (изменить). Цель: усилить или изменить поведение. Правила: быстро, конкретно, о поведении и фактах, без оценки личности, с диалогом и договорённостью.<br><b>Цели:</b> закрепить эффективное поведение, скорректировать неэффективное, развить. <b>Принципы:</b> вовремя; критика наедине, похвала публично; описывать наблюдаемое («отчёт сдан на день позже»), а не оценивать («вы безответственны»); завершать договорённостью."],
["Модели обратной связи","«Сендвич»: плюс, зона роста, плюс. STAR: ситуация, задача, действие, результат. BOFF: поведение, последствия, чувства, будущее. SOR: ситуация, наблюдаемое поведение, результат. «3 плюс 1»: три сильных стороны и одна зона роста.<br><b>Примеры:</b> <i>STAR:</i> «На встрече с клиентом (S) вы должны были согласовать условия (T), вы заранее подготовили три варианта (A), клиент подписал договор (R)». <i>BOFF:</i> «Вы дважды сорвали срок (B), из-за этого отдел продаж потерял сделку (O), я беспокоюсь (F), давайте договоримся о контрольной точке в среду (F)». <i>Сендвич</i> критикуют, так как плюсы обесценивают зону роста; применять осторожно."],
["Ситуационное руководство","Стиль зависит от компетентности и желания сотрудника: директивный (низкая компетентность, высокое желание), наставнический, поддерживающий, делегирующий (высокая зрелость).<br><b>Четыре стиля (Херси-Бланшар):</b> S1 директивный: что, как, когда; S2 наставнический: объясняю и обсуждаю; S3 поддерживающий: помогаю решать, даю вопросы; S4 делегирующий: передаю ответственность. <b>Зрелость</b> оценивают по конкретной задаче, а не по человеку в целом: один и тот же сотрудник может быть на S4 в одной задаче и на S1 в новой."],
["Директивные методы","Уровень распоряжения: чёткая инструкция. Работа с отговорками: услышать, уточнить, вернуть к задаче и сроку. Уровень заданий: задача с результатом и сроком. Работа с отказом от ответственности: вернуть ответственность вопросом «что вы предлагаете?».<br><b>Примеры:</b> распоряжение: «До пятницы 12:00 отправь КП по шаблону». Отговорка «не было времени» → «Что помешало? Что сделаешь, чтобы успеть к четвергу?». Отказ «это не моё» → «Чья это зона, если не твоя? Какой шаг предлагаешь?». Принцип: уважительно, чётко, с итогом."],
["Поддерживающие методы","Уровень предложений: сотрудник предлагает решения, руководитель задаёт вопросы и поддерживает. Коучинговый стиль: вопросы вместо ответов.<br><b>Вопросы:</b> «Какой результат хочешь?», «Какие варианты видишь?», «Что мешает?», «Какой первый шаг и когда?». Модель GROW: цель → реальность → варианты → план. Подходит зрелым сотрудникам при наличии времени; не подходит при кризисе и нулевой компетентности."],
["Вовлечённость и ценности","Вовлечённость: эмоциональная и рациональная приверженность работе и компании. Управление через ценности: ясно озвучить ценности, показывать их примером, связывать с ними признание и решения.<br><b>Драйверы вовлечённости:</b> понятные цели, смысл, автономия, признание, рост, доверие к руководителю. <b>Практика:</b> регулярный опрос, обсуждение ценностей на реальных решениях, награда за поведение по ценностям, а не только за цифры."],
["Теория поколений","Baby Boomers: стабильность и статус. Поколение X: самостоятельность и результат. Y (миллениалы): смысл, развитие, обратная связь. Z: гибкость, цифровая среда, быстрые результаты. Это ориентиры, не ярлыки.<br><b>Как управлять:</b> Boomers: уважение опыта, чёткие правила; X: самостоятельность и прямая коммуникация; Y: смысл, наставничество, частая обратная связь; Z: гибкость, короткие циклы, цифровые каналы. Сначала индивидуальный подход, потом поколенческие гипотезы."],
["Работа со «звездой»","Высокий результат и высокая мотивация. Давать сложные задачи, перспективы роста, признание, наставничество; следить, чтобы «звезда» не нарушала командные нормы и не выгорела.<br><b>Риски:</b> скука, зазнайство, давление на команду, уход к конкуренту. <b>Работа:</b> индивидуальный план развития, проекты с наставничеством, расширение полномочий, честная обратная связь о командном поведении, регулярные разговоры о карьере; не перегружать «потому что справится»."]],

["Виды контроля","Предварительный (до начала: ресурсы, понимание), текущий (в процессе), итоговый (по результату).<br><b>Принципы:</b> контроль конкретен, регулярен, измерим, заранее согласован; контролируем результат и ключевые этапы, а не каждое движение. <b>Ошибки:</b> нет критериев; контроль только при ошибке; тотальный микроменеджмент; отсутствие обратной связи по итогам проверки."],
["Инструменты контроля","Отчёты, чек-листы, планёрки, KPI-дашборды, обходы, контрольные точки, 1-на-1 встречи.<br><b>Выбор:</b> чек-лист для рутины, KPI-дашборд для результата, 1-на-1 для развития, планёрка для синхронизации. Инструмент должен быть простым и давать данные вовремя; цифры без разговора не заменяют контроль."],
["Точки контроля по ситуационному руководству","Чем ниже зрелость сотрудника, тем чаще контрольные точки и детальнее контроль; у высокой зрелости контроль по результату.<br><b>Пример:</b> S1 (новичок): ежедневная проверка и разбор; S2: каждые 2–3 дня, проверка черновика; S3: раз в неделю, обсуждение трудностей; S4: итоговый отчёт. Точки согласуются заранее и привязываются к этапам задачи."],
["Развивающая обратная связь","Фокус на росте: что получилось, что улучшить, какие шаги и поддержка нужны; завершается договорённостью и сроком.<br><b>Структура:</b> 1) сильные стороны с примерами; 2) зона роста с фактами; 3) вопрос «Как вы это видите?»; 4) шаги и ресурсы; 5) срок и дата следующей встречи. Фокус на будущем поведении, а не на разборе прошлого."],
["Дисциплинарная беседа","Факты нарушения, последствия, выслушать объяснение, зафиксировать ожидания и сроки, объяснить последствия при повторе, оформить письменно; без оскорблений и эмоций.<br><b>Структура беседы:</b> 1) цель и формат (наедине); 2) факт нарушения; 3) влияние на результат; 4) выслушать позицию; 5) согласовать ожидания и срок исправления; 6) озвучить последствия при повторе; 7) зафиксировать итоги. Дисциплинарные меры применяют в рамках Трудового кодекса и локальных актов."],
["Алгоритм принятия обратной связи","Выслушать без перебивания, уточнить примеры, поблагодарить, обдумать, решить, что менять, вернуться с планом.<br><b>Как слушать:</b> не оправдываться и не спорить, записывать; фразы: «Спасибо, уточните пример», «Что бы вы предложили?»; затем отделить факты от эмоций и выбрать 1–2 изменения. Через неделю сообщить, что сделано: это укрепляет доверие."],
["Обратная связь вышестоящему","Выбрать момент, говорить о фактах и влиянии на результат, предлагать решения, сохранять уважение, опираться на общую цель.<br><b>Формула:</b> ситуация → влияние на результат → предложение. Пример: «Две недели задачи приходят в пятницу вечером. Команда не успевает проверять качество. Предлагаю получать задачи по четвергам до 12:00». Начните с вопроса: «Могу поделиться наблюдением?»."]],

["Профиль должности","Описание цели позиции, задач, требуемых знаний, навыков и компетенций, KPI; основа подбора, оценки и обучения.<br><b>Разделы:</b> цель должности, подчинённость, функции, KPI, требования (образование, опыт), компетенции с поведенческими индикаторами, условия труда, карьерный трек. Используется при подборе, адаптации, аттестации; пересматривается раз в год."],
["Адаптация и наставничество","План на испытательный срок, welcome-пакет, наставник, регулярные встречи и обратная связь; сокращает срок выхода на результат и текучесть.<br><b>План на 3 месяца:</b> день 1: знакомство, доступы, наставник; неделя 1: цели испытательного срока и обучение; месяц 1: первые самостоятельные задачи и обратная связь; месяц 3: итоговая оценка и план развития. <b>Роль наставника:</b> показывает, объясняет культуру, отвечает на вопросы, но не заменяет руководителя."],
["Подбор и удержание","Источники кандидатов, интервью, оценка соответствия профилю. Удержание: развитие, признание, справедливая оплата, культура, обратная связь.<br><b>Этапы подбора:</b> заявка → профиль → поиск → скрининг → интервью → тестовое/кейс → референсы → оффер. Текучесть = увольнения за период ÷ средняя численность. Удержание: заметить падение вовлечённости, беседы о развитии, прозрачный карьерный путь."],
["Интервью по компетенциям и exit-интервью","По компетенциям: вопросы о реальном прошлом опыте (метод STAR). Exit-интервью: узнать причины ухода и улучшить условия для оставшихся.<br><b>Вопросы по компетенциям:</b> «Расскажите о ситуации... Какая была задача? Что сделали вы? Какой результат?». Оцениваем конкретность, личную роль, результат. <b>Exit:</b> «Что стало главной причиной ухода? Что нам стоит изменить?»; проводит не прямой руководитель, итоги обобщаются без персональных выводов."],
["Управление конфликтами","Стратегии Томаса-Килманна: соперничество, сотрудничество, компромисс, избегание, приспособление. Руководитель выясняет интересы сторон и ищет решение «выиграл-выиграл».<br><b>Когда что:</b> соперничество: срочное решение, безопасность; сотрудничество: важный вопрос и время есть; компромисс: равные силы, нужен быстрый результат; избегание: пустяковый вопрос или нужно остыть; приспособление: вопрос важнее другой стороне. <b>Алгоритм медиации:</b> выслушать каждого, выяснить интересы (не позиции), определить общую цель, предложить варианты, зафиксировать договорённость, проверить через неделю."],
["Управление изменениями","Объяснить причины и выгоды, вовлечь команду, поддержать, быстро показать результаты, закрепить. Типичные реакции: отрицание, сопротивление, исследование, принятие.<br><b>Модель Коттера (кратко):</b> срочность → коалиция → видение → коммуникация → устранение барьеров → быстрые победы → закрепление. Сопротивление чаще вызвано страхом потерять статус, компетентность или контроль. Работает: объяснять «зачем», обучать, слушать, показывать выгоду, не обещать лишнего."]],

  if(!EXTS.includes(fext(f.name))){say('Такой тип файла не разрешён.');return}
  if(f.size>MAXMB*1048576){say('Файл больше '+MAXMB+' МБ. Сожмите его или сохраните презентацию в PDF.');return}
  fbusy=true;fu.disabled=true;say('Загрузка… не закрывайте страницу.');
  const rd=new FileReader();rd.onerror=()=>{fbusy=false;fu.disabled=false;say('Не удалось прочитать файл.')};
  rd.onload=()=>{api({action:'upload',pin:PIN,place:place,module:c,title:t||f.name.replace(/\.[^.]+$/,''),name:f.name,mime:f.type||'application/octet-stream',data:String(rd.result).split(',')[1],by:U.name})
   .then(j=>{fbusy=false;if(j.ok){FILES.push(j.file);ls.s('shk_f',FILES);draw();if(j.shared===false)alert('Файл загружен, но Google запретил общий доступ по ссылке. Другие пользователи его не откроют: проверьте настройки доступа Диска.')}
    else{fu.disabled=false;if(j.error=='pin'){setPin('');alert('Код редактора больше не подходит. Войдите заново.');draw()}else say(j.error=='size'?'Файл слишком большой.':j.error=='type'?'Тип файла не разрешён.':'Ошибка загрузки.')}})
   .catch(()=>{fbusy=false;fu.disabled=false;say('Нет связи с сервером. Проверьте интернет и что опубликована новая версия скрипта.')})};
  rd.readAsDataURL(f)}}
/* вкладка «Материалы» */
function fileTab(d,v){const c=code(d),list=FILES.filter(f=>String(f.module)==c&&f.place!='theory');
 v.innerHTML=(FERR&&!FILES.length?'<div class="empty">Не удалось загрузить список файлов. Проверьте интернет.</div>':list.length?list.map(fcard).join(''):'<div class="empty">Материалов пока нет.</div>')+edHtml(c,'files');
 wireFiles(v,c,'files')}
/* дополнение вкладки «Теория»: загруженные презентации и форма для редактора */
function theoryFiles(d,v){const c=code(d),list=FILES.filter(f=>String(f.module)==c&&f.place=='theory');
 v.insertAdjacentHTML('beforeend',list.map(tcard).join('')+edHtml(c,'theory'));wireFiles(v,c,'theory')}
/* ===== ЗАГРУЖАЕМЫЕ ТЕСТЫ =====
   Редактор выбирает файл Excel (.xlsx, .xls) или CSV прямо на вкладке «Тест» — тест появляется у всех пользователей.
   Формат таблицы (первая строка — заголовки, её можно оставить):
   A «Вопрос» | B–F «Вариант 1…5» (от 2 до 5 заполненных) | G «Верный вариант» (номер: 1, 2, 3…) | H «Пояснение».
   Загруженные тесты хранятся в таблице Google через Apps Script (файл apps_script_tests.gs). */
let TESTS=ls.g('shk_t',[]),tsel={};
const MAXQ=100,TEXTS=['xlsx','xls','csv'];
function loadTests(){if(!CFG_URL)return;const was=JSON.stringify(TESTS);
  fetch(CFG_URL+'?action=tests').then(r=>r.json()).then(j=>{if(!j.ok)throw 0;TESTS=j.tests||[];ls.s('shk_t',TESTS)}).catch(()=>{})
  .then(()=>{if(U&&cur>=0&&!fbusy&&tab=='t'&&was!=JSON.stringify(TESTS)&&!document.querySelector('#v input:checked'))draw()})}
function csvRows(t){t=t.replace(/^\uFEFF/,'');const f=t.split(/\r?\n/)[0]||'',cnt=ch=>f.split(ch).length-1,dl=[';','\t',','].sort((a,b)=>cnt(b)-cnt(a))[0];
  const rows=[];let r=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
   if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
   else if(ch=='"')q=true;
   else if(ch==dl){r.push(c);c=''}
   else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';rows.push(r);r=[]}
   else c+=ch}
  if(c!==''||r.length){r.push(c);rows.push(r)}
  return rows}
const decodeBuf=b=>{try{return new TextDecoder('utf-8',{fatal:true}).decode(b)}catch(e){return new TextDecoder('windows-1251').decode(b)}};
const needXlsx=()=>window.XLSX?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=()=>no(new Error('xlsx'));document.head.appendChild(s)});
function readTable(f){return new Promise((ok,no)=>{const rd=new FileReader();rd.onerror=()=>no(new Error('read'));
  rd.onload=()=>{if(fext(f.name)=='csv')return ok(csvRows(decodeBuf(rd.result)));
   needXlsx().then(()=>{const wb=XLSX.read(rd.result,{type:'array'});ok(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',raw:false}))}).catch(()=>no(new Error('xlsx')))};
  rd.readAsArrayBuffer(f)})}
/* строки таблицы → вопросы в том же формате, что и в блоке «Данные»: [вопрос, [варианты], номер_верного_с_нуля, пояснение] */
function parseTest(rows){const q=[],err=[];
  rows.forEach((r,i)=>{r=r.map(x=>x==null?'':String(x).trim());if(r.every(x=>!x))return;
   if(/^вопрос/i.test(r[0])&&!/^\d+$/.test(r[6]||''))return;
   const n=i+1,o=[];for(let j=1;j<=5;j++)if(r[j])o.push([j,r[j]]);
   const k=parseInt(r[6],10),at=o.findIndex(x=>x[0]==k);
   if(!r[0])err.push('Строка '+n+': нет текста вопроса.');
   else if(o.length<2)err.push('Строка '+n+': нужно минимум два варианта ответа.');
   else if(at<0)err.push('Строка '+n+': в колонке «Верный вариант» укажите номер заполненного варианта (1–5).');
   else q.push([r[0],o.map(x=>x[1]),at,r[7]||('Верный ответ: '+o[at][1])])});
  if(!q.length&&!err.length)err.push('В файле не найдено ни одного вопроса.');
  if(q.length>MAXQ)err.push('Слишком много вопросов: максимум '+MAXQ+'.');
  return{q,err}}
function tmplCsv(){const L=['Вопрос;Вариант 1;Вариант 2;Вариант 3;Вариант 4;Вариант 5;Верный вариант (номер);Пояснение',
  'Что отличает руководителя от специалиста?;Больше личной экспертизы;Результат достигается через других людей;Меньше ответственности;;;2;Руководитель отвечает за результат команды.',
  'Какой стиль подходит новичку?;Либеральный;Директивный;Отказ от управления;;;2;Неопытному сотруднику нужны чёткие указания.'];
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\uFEFF'+L.join('\r\n')],{type:'text/csv;charset=utf-8'}));a.download='шаблон_теста.csv';document.body.appendChild(a);a.click();a.remove()}
/* форма редактора на вкладке «Тест»: список загруженных тестов + загрузка нового */
function tedHtml(c,list){if(!CFG_URL)return'';
  if(!PIN)return'<div class="edbar" style="margin-top:14px"><button type="button" class="fbtn alt" id="fe">Режим редактора</button></div>';
  return '<div class="q fm" style="margin-top:14px"><div class="edbar"><b>Режим редактора</b><button type="button" class="fbtn alt" id="fx">Выйти</button></div>'
   +list.map(t=>{const dt=new Date(t.date);return '<div class="fc"><div class="fb"><b>'+esc(t.title)+'</b><span class="ex">Вопросов: '+t.q.length+(isNaN(dt)?'':' · '+dt.toLocaleDateString('ru-RU'))+'</span></div><div class="fa"><button class="fbtn del" type="button" data-tdel="'+esc(t.id)+'">Удалить</button></div></div>'}).join('')
   +'<input id="tt" maxlength="120" placeholder="Название теста (необязательно)"><input id="tf" type="file" accept=".xlsx,.xls,.csv">'
   +'<div class="ex" style="margin:0 0 10px">Таблица Excel или CSV: один вопрос в строке. Колонки: A — вопрос, B–F — варианты ответа (от 2 до 5), G — номер верного варианта, H — пояснение. До '+MAXQ+' вопросов.</div>'
   +'<div class="fa" style="margin:0 0 10px"><button class="fbtn alt" id="tn" type="button">Скачать шаблон</button></div>'
   +'<div class="fmsg" id="tg" role="status"></div><button class="btn" id="tu" type="button">Загрузить тест в модуль '+esc(c)+'</button></div>'}
function wireTests(v,c){wireAuth();
  const say=t=>{const g=document.getElementById('tg');if(g)g.textContent=t};
  v.querySelectorAll('[data-tdel]').forEach(b=>b.onclick=()=>{if(!confirm('Удалить этот тест?'))return;b.disabled=true;
   api({action:'test_delete',pin:PIN,id:b.dataset.tdel}).then(j=>{if(j.ok){TESTS=TESTS.filter(x=>String(x.id)!=b.dataset.tdel);ls.s('shk_t',TESTS);delete tsel[c];draw()}else{if(j.error=='pin')setPin('');alert('Не удалось удалить.');draw()}}).catch(()=>{alert('Нет связи с сервером.');b.disabled=false})});
  const tn=document.getElementById('tn');if(tn)tn.onclick=tmplCsv;
  const tu=document.getElementById('tu');if(tu)tu.onclick=()=>{const f=document.getElementById('tf').files[0],t=document.getElementById('tt').value.trim();
   if(!f){say('Выберите файл.');return}
   if(!TEXTS.includes(fext(f.name))){say('Нужен файл Excel (.xlsx, .xls) или CSV.');return}
   if(f.size>2*1048576){say('Файл слишком большой для теста.');return}
   fbusy=true;tu.disabled=true;say('Читаю файл…');
   readTable(f).then(rows=>{const p=parseTest(rows);
    if(p.err.length){fbusy=false;tu.disabled=false;say(p.err.slice(0,5).join(' ')+(p.err.length>5?' …и ещё ошибок: '+(p.err.length-5):''));return}
    say('Загрузка… не закрывайте страницу.');
    return api({action:'test_save',pin:PIN,module:c,title:t||f.name.replace(/\.[^.]+$/,''),q:p.q,by:U.name}).then(j=>{fbusy=false;
     if(j.ok){TESTS.push(j.test);ls.s('shk_t',TESTS);tsel[c]=String(j.test.id);draw()}
     else{tu.disabled=false;if(j.error=='pin'){setPin('');alert('Код редактора больше не подходит. Войдите заново.');draw()}else say(j.error=='size'?'Тест слишком большой.':'Ошибка загрузки.')}})})
   .catch(e=>{fbusy=false;tu.disabled=false;say(e&&e.message=='xlsx'?'Не удалось открыть Excel-файл. Сохраните таблицу как CSV и загрузите снова.':e&&e.message=='read'?'Не удалось прочитать файл.':'Нет связи с сервером. Проверьте интернет и что опубликована новая версия скрипта.')})}}
/* вкладка ТЕСТ: основной тест из блока «Данные» + загруженные со страницы; кнопка «Проверить знания», подсчёт и результат (блок .res) */
function testTab(d,v){const c=code(d),list=TESTS.filter(t=>String(t.module)==c&&Array.isArray(t.q)&&t.q.length);
  const T=list.find(t=>String(t.id)==tsel[c]),Q=T?T.q:d.q,ty=T?'Тест: '+T.title:'Тест',X=T?esc:z=>z;
  const chips=list.length?'<div class="chips" role="group" aria-label="Выбор теста">'+[['','Основной тест']].concat(list.map(t=>[String(t.id),t.title])).map(x=>'<button type="button" aria-pressed="'+((T?String(T.id):'')==x[0])+'" data-ts="'+esc(x[0])+'">'+esc(x[1])+'</button>').join('')+'</div>':'';
  v.innerHTML=chips+Q.map((q,i)=>'<div class="q"><b>'+(i+1)+'. '+X(q[0])+'</b>'+q[1].map((o,j)=>'<label><input type="radio" name="q'+i+'" value="'+j+'"> '+X(o)+'</label>').join('')+'<div class="ex" hidden></div></div>').join('')+'<div id="r"></div><button class="btn" id="ck">Проверить знания</button>'+tedHtml(c,list);
  v.querySelectorAll('[data-ts]').forEach(b=>b.onclick=()=>{tsel[c]=b.dataset.ts;draw()});
  document.getElementById('ck').onclick=()=>{let s=0,un=0;const qs=v.querySelectorAll('.q:not(.fm)');qs.forEach(e=>{if(!e.querySelector('input:checked'))un++});
   if(un){document.getElementById('r').innerHTML='<div class="res">Ответьте на все вопросы: не отвечено '+un+'.</div>';return}
   qs.forEach((e,i)=>{const q=Q[i],k=+e.querySelector('input:checked').value;e.querySelectorAll('label').forEach((l,j)=>{if(j==q[2])l.classList.add('ok');else if(j==k)l.classList.add('no');l.querySelector('input').disabled=true});if(k==q[2])s++;const x=e.querySelector('.ex');x.hidden=false;x.textContent=(k==q[2]?'Верно. ':'Неверно. ')+q[3]});
   const p=Math.round(s/Q.length*100);rec(d.n,ty,p);document.getElementById('r').innerHTML='<div class="res">Результат: <strong>'+s+' из '+Q.length+'</strong> ('+p+'%). '+(p==100?'Отлично, модуль освоен.':p>=70?'Хорошо, повторите ошибочные темы.':'Нужно повторить теорию и пройти тест снова.')+'</div>';
   document.getElementById('ck').textContent='Пройти заново';document.getElementById('ck').onclick=draw;document.getElementById('r').scrollIntoView({behavior:'smooth'})};
  wireTests(v,c)}
function draw(){if(cur<0){m.innerHTML='<h2>'+esc(ROLES.find(r=>r.id==R).t)+'</h2><div class="empty">Материалы этого раздела готовятся. Загляните позже.</div>';return}const d=D[cur];m.innerHTML='<h2>Модуль '+d.n+'</h2><div class="tabs" role="tablist">'+[['th','Теория'],['t','Тест'],['k','Кейс'],['f','Материалы']].map(x=>'<button role="tab" aria-selected="'+(tab==x[0])+'" data-t="'+x[0]+'">'+x[1]+'</button>').join('')+'</div><div id="v"></div>';
m.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw();if(tab=='f')loadFiles();if(tab=='t')loadTests()});
const v=document.getElementById('v');
if(tab=='f')fileTab(d,v);
/* вкладка ТЕОРИЯ: раскрывающиеся блоки */
if(tab=='th'){v.innerHTML=d.th.map((t,i)=>'<details'+(i==0?' open':'')+'><summary>'+t[0]+'</summary>'+(t[1]?'<p>'+t[1]+'</p>':'')+(t[2]&&t[2].length?slides(t[2]):'')+'</details>').join('');v.querySelectorAll('.sl').forEach(initSl);theoryFiles(d,v)}
/* вкладка ТЕСТ — см. функцию testTab выше */
if(tab=='t')testTab(d,v);
/* вкладка КЕЙС: выбор решения и разбор */
if(tab=='k'){const k=d.k;v.innerHTML='<div class="sit"><b>Ситуация.</b> '+k[0]+'</div><b>Какое решение лучшее?</b><div style="margin-top:8px">'+k[1].map((o,i)=>'<label><input type="radio" name="k" value="'+i+'"> '+o[0]+'</label>').join('')+'</div><div id="r"></div><button class="btn" id="ck">Проверить решение</button>';
document.getElementById('ck').onclick=()=>{const c=v.querySelector('input:checked');if(!c){document.getElementById('r').innerHTML='<div class="res">Выберите вариант.</div>';return}
const o=k[1][+c.value];rec(d.n,'Кейс',o[1]?100:0);v.querySelectorAll('label').forEach((l,i)=>{if(k[1][i][1])l.classList.add('ok');else if(i==+c.value)l.classList.add('no');l.querySelector('input').disabled=true});
document.getElementById('r').innerHTML='<div class="res"><strong>'+(o[1]?'Верное решение':'Не лучший выбор')+'</strong><br>'+o[2]+(o[1]?'':'<br>Правильный ответ: '+k[1].find(x=>x[1])[0])+'</div>';document.getElementById('ck').style.display='none'}}}
start();
</script></body></html>
